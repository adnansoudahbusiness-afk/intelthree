<meta charset="UTF-8">

<title>ThreeUp Intel</title>

<style>
:root{
  --purple:#A396DC;--pdim:rgba(163,150,220,.13);--pborder:rgba(163,150,220,.35);
  --white:#ffffff;--off:#fafafa;--text:#1a1a1a;--muted:#6b6b6b;--border:#e5e5e5;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --sidebar-w:220px;--r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--off);color:var(--text);font-family:'DM Mono',monospace;font-size:14px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--off);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--white);}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.login-logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--purple);letter-spacing:-0.5px;}
.login-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.login-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.login-input{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 16px;font-family:'DM Mono',monospace;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;}
.login-input:focus{border-color:var(--purple);}
.login-btn{background:var(--purple);color:#fff;border:none;border-radius:var(--r);padding:14px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;}
.login-btn:hover{opacity:.88;}
.login-err{color:var(--red);font-size:12px;text-align:center;min-height:18px;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.shake{animation:shake .4s ease;}

/* APP SHELL */
#app{display:none;height:100vh;overflow:hidden;}
.app-inner{display:flex;height:100%;}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;overflow-y:auto;flex-shrink:0;}
.sb-logo{padding:24px 20px 8px;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--purple);letter-spacing:-0.3px;line-height:1.2;}
.sb-logo-sub{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;font-weight:400;margin-top:2px;}
.sb-divider{height:1px;background:var(--border);margin:14px 0;}
.sb-section{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 20px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;border-left:3px solid transparent;user-select:none;}
.nav-item:hover{background:var(--off);color:var(--text);}
.nav-item.active{color:var(--purple);border-left-color:var(--purple);background:var(--pdim);font-weight:500;}
.nav-icon{font-size:13px;width:18px;text-align:center;}
.sb-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);}
.sb-user{margin-bottom:10px;line-height:1.7;}
.sb-user strong{color:var(--text);display:block;font-size:12px;}
.btn-logout{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;width:100%;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--white);flex-shrink:0;}
.module-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;flex:1;color:var(--text);}
.header-meta{font-size:11px;color:var(--muted);}
.btn-refresh{background:var(--purple);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn-refresh:hover{opacity:.85;}
#content{flex:1;overflow-y:auto;padding:24px;background:var(--off);}
.sb-toggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;}

/* GRID */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px;}
.card-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;}

/* METRIC CARDS */
.metric-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.metric-val{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:var(--purple);line-height:1;}
.metric-val.warn{color:var(--amber);}
.metric-val.neutral{color:var(--text);}
.metric-sub{font-size:11px;color:var(--muted);margin-top:8px;}

/* SECTION HEADER */
.section-h{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin:28px 0 14px;color:var(--text);padding-bottom:10px;border-bottom:1px solid var(--border);}
.section-h:first-child{margin-top:0;}

/* FUNNEL */
.funnel-flow{display:flex;flex-direction:column;align-items:center;}
.funnel-node{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 20px;width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;}
.funnel-node.bottleneck{border-color:var(--red);background:#fff5f5;}
.fn-label{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.fn-count{font-size:13px;color:var(--muted);}
.funnel-arrow{display:flex;flex-direction:column;align-items:center;padding:5px 0;gap:1px;width:100%;max-width:500px;}
.fa-conv{font-family:'DM Mono',monospace;font-size:12px;color:var(--green);}
.fa-icon{font-size:16px;color:var(--muted);line-height:1;}
.fa-drop{font-size:11px;color:var(--muted);}
.funnel-arrow.is-leak .fa-conv{color:var(--red);}
.funnel-arrow.is-leak .fa-drop{color:var(--red);font-weight:500;}
.funnel-arrow.is-leak .fa-icon{color:var(--red);}
.leak-badge{background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:1px 7px;font-size:9px;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-left:6px;}

/* SEGMENT TABLE */
.seg-table{width:100%;border-collapse:collapse;font-size:12px;}
.seg-table th{text-align:left;padding:6px 8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1.5px solid var(--border);font-weight:400;}
.seg-table td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
.seg-table tr:last-child td{border-bottom:none;}
.seg-table tr:hover td{background:var(--off);}
.cr-high{color:var(--green);font-weight:500;}
.cr-med{color:var(--amber);}
.cr-low{color:var(--red);}

/* ICP CARD */
.icp-card{background:var(--white);border:2px solid var(--purple);border-radius:var(--r);padding:20px;margin-bottom:20px;}
.icp-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
.icp-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.icp-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.icp-key{font-size:11px;color:var(--muted);min-width:90px;}
.icp-val{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.icp-meta{font-size:11px;color:var(--muted);}
.icp-action{padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.6;}
.icp-action strong{color:var(--purple);}

/* BAR CHART */
.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-key{font-size:12px;color:var(--text);min-width:90px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:20px;background:var(--off);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.bar-fill{height:100%;background:var(--purple);border-radius:3px;opacity:.65;}
.bar-val{font-size:11px;color:var(--muted);min-width:64px;text-align:right;}
.bar-n{font-size:10px;color:var(--muted);min-width:36px;}

/* LOSS ANALYSIS */
.loss-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.loss-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
.loss-item:last-child{border-bottom:none;}
.loss-rank{font-size:11px;color:var(--muted);min-width:20px;}
.loss-name{flex:1;font-size:13px;color:var(--text);text-transform:capitalize;}
.loss-count{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.loss-pct{font-size:11px;color:var(--muted);min-width:34px;text-align:right;}
.obj-list{display:flex;flex-direction:column;gap:7px;}
.obj-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--off);border-radius:6px;border:1px solid var(--border);}
.obj-text{flex:1;font-size:12px;color:var(--text);}
.obj-cnt{font-size:11px;color:var(--muted);}

/* AI / MARKDOWN */
.ai-wrap{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:var(--r);padding:24px;margin-bottom:20px;}
.ai-header-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.ai-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--text);}
.ai-badge{background:var(--pdim);color:var(--purple);border:1px solid var(--pborder);border-radius:20px;padding:3px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;}
.md-h3{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin:20px 0 8px;}
.md-h4{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--purple);margin:14px 0 6px;}
.md-p{font-size:13px;color:var(--text);line-height:1.7;margin-bottom:8px;}
.md-ul,.md-ol{padding-left:20px;margin-bottom:8px;}
.md-ul li,.md-ol li{font-size:13px;color:var(--text);line-height:1.7;margin-bottom:3px;}
code{background:var(--off);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:12px;}

/* LOADING / ERROR */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--muted);}
.error-wrap{background:var(--white);border:1px solid #fca5a5;border-radius:var(--r);padding:24px;text-align:center;}
.error-msg{color:var(--red);font-size:13px;margin-bottom:14px;}
.btn-retry{background:none;border:1px solid var(--red);border-radius:6px;padding:8px 20px;font-family:'DM Mono',monospace;font-size:12px;color:var(--red);cursor:pointer;}

/* PLACEHOLDER */
.placeholder-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;text-align:center;padding:40px;}
.placeholder-icon{font-size:48px;opacity:.2;}
.placeholder-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);}
.placeholder-sub{font-size:13px;color:var(--muted);max-width:480px;line-height:1.7;}

/* RESPONSIVE */
@media(max-width:768px){
  .sb-toggle{display:block;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .25s;}
  #sidebar.open{transform:translateX(0);}
  .sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;}
  .sb-overlay.show{display:block;}
  #main{width:100%;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .loss-grid{grid-template-columns:1fr;}
  #content{padding:16px;}
  .main-header{gap:10px;}
  .header-meta{display:none;}
}
</style>

// ── AUTH ──
function getSession() { try { return JSON.parse(localStorage.getItem('tui_sess')||'null'); } catch(e) { return null; } }
function setSession(u) { localStorage.setItem('tui_sess', JSON.stringify({authenticated:true,user:u})); }
function clearSession() { localStorage.removeItem('tui_sess'); }

// ── UTILS ──
function sleep(ms) { return new Promise(function(r){ setTimeout(r,ms); }); }
function pct(n,d) { return d>0 ? (n/d*100).toFixed(1) : '0.0'; }
function fmt(n) { return Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtJOD(n) { return 'JOD '+fmt(n); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── GHL API ──
async function ghlFetch(path, opts) {
  opts = opts||{};
  var headers = Object.assign({
    'Authorization': 'Bearer '+CFG.ghlKey,
    'Version': '2021-07-28',
    'Content-Type': 'application/json',
  }, opts.headers||{});
  var attempts = 0;
  while (attempts < 4) {
    var res = await fetch(CFG.ghlBase+path, Object.assign({},opts,{headers:headers}));
    if (res.status===429) { attempts++; await sleep(1500); continue; }
    if (!res.ok) throw new Error('GHL HTTP '+res.status);
    return res;
  }
  throw new Error('Rate limit exceeded');
}

async function fetchAllContacts(onProgress) {
  var all=[], page=1, total=null;
  while (true) {
    var res  = await ghlFetch('/contacts/?locationId='+CFG.ghlLoc+'&limit=100&page='+page);
    var data = await res.json();
    var batch = data.contacts||[];
    if (total===null && data.meta && data.meta.total) total=data.meta.total;
    all = all.concat(batch);
    if (onProgress) onProgress(all.length, total);
    if (!batch.length || batch.length<100) break;
    if (total!==null && all.length>=total) break;
    page++;
  }
  return all;
}

// ── DATA HELPERS ──
function gf(contact, fieldName) {
  var id = FIELD_MAP[fieldName];
  if (!id) return null;
  var fields = contact.customFields || contact.custom_fields || [];
  for (var i=0; i<fields.length; i++) {
    var f = fields[i];
    if (f.id === id) {
      var v = f.value !== undefined ? f.value : (f.fieldValue !== undefined ? f.fieldValue : null);
      return (v !== null && v !== undefined && v !== '') ? String(v) : null;
    }
  }
  return null;
}

function hasTag(c, t) { return (c.tags||[]).indexOf(t) !== -1; }

function isClosedWon(c)      { return hasTag(c,'client') || gf(c,'closed_won')==='yes'; }
function isSiteVisitDone(c)  { return isClosedWon(c) || gf(c,'site_visit_done')==='yes'; }
function isSiteVisitBooked(c){ return isSiteVisitDone(c) || hasTag(c,'site-visit') || gf(c,'site_visit_booked')==='yes'; }
function isMeetingDone(c) {
  var v = gf(c,'meeting_done');
  return isSiteVisitBooked(c) || hasTag(c,'meeting-done') || v==='yes' || v==='not yet';
}
function isMeetingBooked(c)  { return isMeetingDone(c) || hasTag(c,'meeting-booked') || gf(c,'meeting_booked')==='yes'; }
function isContacted(c)      { return isMeetingBooked(c) || hasTag(c,'contacted') || gf(c,'contacted')==='yes'; }

var EXCLUDE_TAGS = ['archived','group','low-priority','free-trial','wa group','whatsapp'];

function filterContacts(contacts) {
  return contacts.filter(function(c) {
    var tags = c.tags||[];
    if (EXCLUDE_TAGS.some(function(t){ return tags.indexOf(t)!==-1; })) return false;
    return isContacted(c) || isClosedWon(c);
  });
}

// ── COMPUTATIONS ──
function computePipeline(contacts) {
  var stages = [
    { label:'All Leads',          n: contacts.length },
    { label:'Contacted',          n: contacts.filter(isContacted).length },
    { label:'Meeting Booked',     n: contacts.filter(isMeetingBooked).length },
    { label:'Meeting Done',       n: contacts.filter(isMeetingDone).length },
    { label:'Site Visit Booked',  n: contacts.filter(isSiteVisitBooked).length },
    { label:'Site Visit Done',    n: contacts.filter(isSiteVisitDone).length },
    { label:'Closed Won',         n: contacts.filter(isClosedWon).length },
  ];
  var maxDrop=0, bottleneckIdx=1;
  for (var i=1; i<stages.length; i++) {
    var prev=stages[i-1].n, curr=stages[i].n;
    stages[i].convPct = prev>0 ? parseFloat((curr/prev*100).toFixed(1)) : 0;
    stages[i].dropPct = prev>0 ? parseFloat(((1-curr/prev)*100).toFixed(1)) : 0;
    if (stages[i].dropPct > maxDrop) { maxDrop=stages[i].dropPct; bottleneckIdx=i; }
  }
  stages[0].convPct=100; stages[0].dropPct=0;
  return { stages:stages, bottleneckIdx:bottleneckIdx };
}

function computeTopMetrics(contacts) {
  var prospects = contacts.filter(function(c){ return !isClosedWon(c) && isContacted(c); });
  var pipelineValue=0;
  prospects.forEach(function(c) { var v=parseFloat(gf(c,'monthly_value')); if (!isNaN(v)&&v>0) pipelineValue+=v*12; });
  var wonValues=[];
  contacts.filter(isClosedWon).forEach(function(c) { var v=parseFloat(gf(c,'monthly_value')); if (!isNaN(v)&&v>0) wonValues.push(v*12); });
  var avgDeal = wonValues.length ? Math.round(wonValues.reduce(function(a,b){return a+b;},0)/wonValues.length) : 0;
  var qualified = contacts.filter(function(c){ return isClosedWon(c)||hasTag(c,'lost')||hasTag(c,'cold')||hasTag(c,'re-engage')||hasTag(c,'lost-client'); });
  var closeRate = qualified.length ? parseFloat(pct(contacts.filter(isClosedWon).length, qualified.length)) : 0;
  var now=Date.now(), daysArr=[];
  contacts.filter(isClosedWon).forEach(function(c) {
    var ds=gf(c,'discovery_call_date'); if (!ds) return;
    var d=new Date(ds); if (isNaN(d.getTime())) return;
    daysArr.push(Math.floor((now-d.getTime())/86400000));
  });
  var avgDays = daysArr.length ? Math.round(daysArr.reduce(function(a,b){return a+b;},0)/daysArr.length) : null;
  return { pipelineValue:pipelineValue, avgDeal:avgDeal, closeRate:closeRate, avgDays:avgDays };
}

function computeSegments(contacts) {
  var pool = contacts.filter(isContacted);
  function analyze(fieldName) {
    var groups={};
    pool.forEach(function(c) {
      var v=(gf(c,fieldName)||'unknown').toLowerCase().trim()||'unknown';
      if (!groups[v]) groups[v]={total:0,won:0,valueSum:0,valueCount:0};
      groups[v].total++;
      if (isClosedWon(c)) {
        groups[v].won++;
        var mv=parseFloat(gf(c,'monthly_value'));
        if (!isNaN(mv)&&mv>0) { groups[v].valueSum+=mv; groups[v].valueCount++; }
      }
    });
    return Object.keys(groups).map(function(k) {
      var g=groups[k];
      return {
        key:k, total:g.total, won:g.won,
        rate: g.total>0 ? parseFloat((g.won/g.total*100).toFixed(1)) : 0,
        avgAnnual: g.valueCount>0 ? Math.round(g.valueSum/g.valueCount*12) : 0,
      };
    }).sort(function(a,b){ return b.rate-a.rate; });
  }
  return { bySource:analyze('lead_source'), bySpecialty:analyze('clinic_specialty'), byCity:analyze('lead_city') };
}

function computeLostReasons(contacts) {
  var lost = contacts.filter(function(c){ return hasTag(c,'lost')||hasTag(c,'cold')||hasTag(c,'re-engage')||hasTag(c,'lost-client'); });
  var counts={}, total=0;
  lost.forEach(function(c) {
    var r = gf(c,'lost_reason') || gf(c,'if_not_closed_why');
    if (!r) return;
    r.split(',').forEach(function(p) { p=p.trim(); if (!p) return; counts[p]=(counts[p]||0)+1; total++; });
  });
  return {
    reasons: Object.keys(counts).map(function(k){ return {reason:k,count:counts[k],pct:parseFloat(pct(counts[k],total))}; }).sort(function(a,b){return b.count-a.count;}),
    total:total, n:lost.length,
  };
}

function computeObjections(contacts) {
  var stop = new Set(['the','and','but','for','that','this','with','from','they','have','were','what','their','about','said','which','into','there','when','more','will','been','each','some','also','than','your','then','would','could','should','very','just','dont','isnt','cant','wont','does','dont','want','need','like','know','think','feel']);
  var counts={}, n=0;
  contacts.forEach(function(c) {
    var obj=gf(c,'objection'); if (!obj) return; n++;
    obj.toLowerCase().split(/\W+/).forEach(function(w) {
      if (w.length>=4 && !stop.has(w)) counts[w]=(counts[w]||0)+1;
    });
  });
  return {
    items: Object.keys(counts).map(function(w){ return {text:w,count:counts[w]}; }).sort(function(a,b){return b.count-a.count;}).slice(0,10),
    n:n,
  };
}

function computeRevenue(contacts) {
  var clients = contacts.filter(isClosedWon);
  var mrr=0, count=0, bySpec={}, bySrc={}, byCity={};
  clients.forEach(function(c) {
    var v=parseFloat(gf(c,'monthly_value')); if (isNaN(v)||v<=0) return;
    mrr+=v; count++;
    var sp=(gf(c,'clinic_specialty')||'unknown').toLowerCase().trim();
    var sr=(gf(c,'lead_source')||'unknown').toLowerCase().trim();
    var cy=(gf(c,'lead_city')||'unknown').toLowerCase().trim();
    bySpec[sp]=(bySpec[sp]||0)+v;
    bySrc[sr]=(bySrc[sr]||0)+v;
    byCity[cy]=(byCity[cy]||0)+v;
  });
  function toArr(o){ return Object.keys(o).map(function(k){return{key:k,val:o[k]};}).sort(function(a,b){return b.val-a.val;}); }
  return { mrr:mrr, avg:count>0?mrr/count:0, clientCount:clients.length, withValue:count, bySpec:toArr(bySpec), bySrc:toArr(bySrc), byCity:toArr(byCity) };
}

// ── RENDERERS ──
function renderFunnel(pipeline) {
  var html = '<div class="funnel-flow">';
  pipeline.stages.forEach(function(s,i) {
    var isBottle = (i===pipeline.bottleneckIdx);
    html += '<div class="funnel-node'+(isBottle?' bottleneck':'')+'">'+
      '<div class="fn-label">'+esc(s.label)+'</div>'+
      '<div class="fn-count">n='+s.n+'</div>'+
      '</div>';
    if (i < pipeline.stages.length-1) {
      var next = pipeline.stages[i+1];
      var isLeak = (i+1)===pipeline.bottleneckIdx;
      html += '<div class="funnel-arrow'+(isLeak?' is-leak':'')+'">'+
        '<div class="fa-conv">'+next.convPct+'% convert'+(isLeak?'<span class="leak-badge">REVENUE LEAK</span>':'')+'</div>'+
        '<div class="fa-icon">&#x2193;</div>'+
        '<div class="fa-drop">&minus;'+next.dropPct+'% drop-off</div>'+
        '</div>';
    }
  });
  html += '</div>';
  return html;
}

function renderBarChart(rows) {
  if (!rows||!rows.length) return '<div style="color:var(--muted);font-size:12px">No data</div>';
  var maxVal = Math.max.apply(null, rows.map(function(r){ return r.val||0; }));
  return '<div class="bar-chart">'+rows.map(function(r) {
    var w = maxVal>0 ? Math.max(3,Math.round(r.val/maxVal*100)) : 0;
    var disp = r.displayVal !== undefined ? r.displayVal : fmtJOD(r.val);
    return '<div class="bar-row">'+
      '<div class="bar-key" title="'+esc(r.key)+'">'+esc(r.key)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'+
      '<div class="bar-val">'+esc(String(disp))+'</div>'+
      (r.n ? '<div class="bar-n">n='+r.n+'</div>' : '')+
      '</div>';
  }).join('')+'</div>';
}

function renderSegmentTable(rows) {
  if (!rows||!rows.length) return '<div style="color:var(--muted);font-size:12px">No data</div>';
  var html = '<table class="seg-table"><thead><tr>'+
    '<th>Segment</th><th>Leads</th><th>Won</th><th>Close %</th><th>Avg Annual</th>'+
    '</tr></thead><tbody>';
  rows.slice(0,8).forEach(function(r) {
    var cls = r.rate>=40?'cr-high':r.rate>=20?'cr-med':'cr-low';
    html += '<tr>'+
      '<td>'+esc(r.key)+'</td>'+
      '<td>'+r.total+'</td>'+
      '<td>'+r.won+'</td>'+
      '<td class="'+cls+'">'+r.rate+'%</td>'+
      '<td>'+(r.avgAnnual>0?fmtJOD(r.avgAnnual):'—')+'</td>'+
      '</tr>';
  });
  return html+'</tbody></table>';
}

function renderMarkdown(text) {
  if (!text) return '';
  var html='', inList=false, listTag='ul';
  function inline(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
            .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function closeList(){ if(inList){ html+='</'+listTag+'>'; inList=false; } }
  text.split('\n').forEach(function(line) {
    var t=line.trim();
    if (!t) { closeList(); return; }
    if (t.startsWith('### ')){ closeList(); html+='<h4 class="md-h4">'+inline(t.slice(4))+'</h4>'; return; }
    if (t.startsWith('## ')) { closeList(); html+='<h3 class="md-h3">'+inline(t.slice(3))+'</h3>'; return; }
    if (t.startsWith('# '))  { closeList(); html+='<h3 class="md-h3">'+inline(t.slice(2))+'</h3>'; return; }
    if (/^\d+\.\s/.test(t)) {
      if (!inList||listTag!=='ol'){ closeList(); html+='<ol class="md-ol">'; inList=true; listTag='ol'; }
      html+='<li>'+inline(t.replace(/^\d+\.\s/,''))+'</li>'; return;
    }
    if (t.startsWith('- ')||t.startsWith('* ')) {
      if (!inList||listTag!=='ul'){ closeList(); html+='<ul class="md-ul">'; inList=true; listTag='ul'; }
      html+='<li>'+inline(t.slice(2))+'</li>'; return;
    }
    closeList();
    html+='<p class="md-p">'+inline(t)+'</p>';
  });
  closeList();
  return html;
}

      topObjections: objs.items.slice(0,5),
      mrr: rev.mrr,
    };
    callAI(payload).then(function(mdText) {
      var aiEl = document.getElementById('ai-section');
      if (!aiEl) return;
      if (!mdText) {
        aiEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">AI recommendations unavailable. Add an Anthropic API key to localStorage under key <code>tui_ai_key</code> to enable.</div>';
        return;
      }
      aiEl.innerHTML = renderMarkdown(mdText);
    });

  } catch(e) {
    content.innerHTML = '<div class="error-wrap"><div class="error-msg">Error: '+esc(e.message)+'</div><button class="btn-retry" onclick="loadSalesModule(true)">&#x21BB; Retry</button></div>';
  }
}

// ── AI CALL ──
async function callAI(metrics) {
  var apiKey = localStorage.getItem('tui_ai_key')||'';
  var headers = {
    'Content-Type': 'application/json',
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true',
  };
  if (apiKey) headers['x-api-key'] = apiKey;

  var system = 'You are designing a GHL sales pipeline for ThreeUp Solutions based on real conversion data. Output must be: (1) Exact pipeline stage names, (2) What action triggers each stage transition, (3) What automation should fire at each stage, (4) Which stages need manual intervention vs automation. Be specific and commercial.';
  var user = 'Here is ThreeUp\'s sales data: '+JSON.stringify(metrics)+'\n\nDesign the optimal GHL pipeline. Include:\n- Stage names (5-8 stages max)\n- Entry criteria for each stage\n- Exit criteria / advancement trigger\n- Recommended automation (tags, workflows, notifications)\n- Manual touchpoints needed\n- KPIs to track per stage\n\nFocus on: (1) catching leads at the biggest drop-off point, (2) automating follow-up where conversion is weakest, (3) prioritizing high-value lead profiles.\n\nRespond in markdown with clear headers. Be specific and actionable.';

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        model: CFG.aiModel,
        max_tokens: 2000,
        system: system,
        messages: [{ role:'user', content:user }],
      }),
    });
    if (!res.ok) return null;
    var data = await res.json();
    var text = data.content && data.content[0] && data.content[0].text;
    return text||null;
  } catch(e) {
    console.warn('[Intel] AI call failed:', e.message);
    return null;
  }
}

// ── PLACEHOLDER MODULES ──
function loadPlaceholder(name, icon, sub, cards) {
  document.getElementById('module-title').textContent = name;
  document.getElementById('header-meta').textContent = '';
  var cardsHtml = cards.map(function(c) {
    return '<div style="background:var(--white);border:1px dashed var(--border);border-radius:var(--r);padding:16px;min-width:150px">'+
      '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">'+esc(c)+'</div>'+
      '<div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;color:var(--border)">—</div>'+
      '</div>';
  }).join('');
  document.getElementById('content').innerHTML =
    '<div class="placeholder-wrap">'+
    '<div class="placeholder-icon">'+icon+'</div>'+
    '<div class="placeholder-title">'+esc(name)+'</div>'+
    '<div class="placeholder-sub">'+esc(sub)+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;justify-content:center">'+cardsHtml+'</div>'+
    '</div>';
}

function loadRetentionModule() {
  loadPlaceholder('Retention Intelligence','&#x25CB;',
    'Analyzes CAO weekly reports to predict churn risk and client health scores. Ingests 30 client Google Sheets and surfaces early warning signals before clients churn.',
    ['Churn Risk Score','Avg Health Score','Clients at Risk','Trigger Link Rate','Avg New Patients','MoM Growth']);
}
function loadContentModule() {
  loadPlaceholder('Content Intelligence','&#x25A1;',
    'Generates content ideas from objections, lost deals, and competitor weaknesses. Turns your sales data into scroll-stopping content frameworks for Meta Ads and organic.',
    ['Top Objection Theme','Content Angles','Hook Ideas']);
}
function loadCEOModule() {
  loadPlaceholder('CEO War Room','&#x2605;',
    'Monday morning strategic brief. Priorities, leak detection, growth opportunities, and decision recommendations — all in one 60-second read.',
    ['Priority #1','Revenue at Risk','Growth Opportunity']);
}

// ── MODULE ROUTER ──
function loadModule(name, force) {
  _activeModule = name;
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.module===name);
  });
  closeSidebar();
  if      (name==='sales')     loadSalesModule(force);
  else if (name==='retention') loadRetentionModule();
  else if (name==='content')   loadContentModule();
  else if (name==='ceo')       loadCEOModule();
}

// ── SIDEBAR ──
function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sb-overlay').classList.add('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sb-overlay').classList.remove('show'); }

// ── LOGIN ──
function initLogin() {
  var inp=document.getElementById('pw-input'), btn=document.getElementById('login-btn'), err=document.getElementById('login-err');
  function attempt() {
    var pw=inp.value.trim(), user=PASSWORDS[pw];
    if (user) { setSession(user); showApp(user); }
    else {
      err.textContent='Access denied.';
      inp.classList.add('shake');
      inp.addEventListener('animationend',function(){ inp.classList.remove('shake'); },{once:true});
      inp.select();
    }
  }
  btn.addEventListener('click', attempt);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
}

function showApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sb-user-name').textContent = user.charAt(0).toUpperCase()+user.slice(1);
  loadModule('sales');
}

// ── EVENT WIRING ──
document.querySelectorAll('.nav-item').forEach(function(el) {
  el.addEventListener('click', function(){ loadModule(el.dataset.module); });
});
document.getElementById('logout-btn').addEventListener('click', function() {
  clearSession();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-err').textContent = '';
  _contacts = [];
});
document.getElementById('refresh-btn').addEventListener('click', function(){ loadModule(_activeModule,true); });
document.getElementById('sb-toggle').addEventListener('click', openSidebar);
document.getElementById('sb-overlay').addEventListener('click', closeSidebar);

// ── INIT ──
(function init() {
  initLogin();
  var sess = getSession();
  if (sess && sess.authenticated && sess.user) showApp(sess.user);
})();
</script>
