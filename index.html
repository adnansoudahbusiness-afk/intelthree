<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreeUp Intelligence OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0d0d; --surf:#161616; --raised:#1e1e1e; --border:#2a2a2a;
  --text:#f0ede8; --muted:#888888; --accent:#c8f04d; --acch:#b8e040;
  --red:#ff5a5a; --amber:#ffb84d; --blue:#5ab4ff; --purple:#b48eff;
  --teal:#4dffd4; --green:#4dff91;
  --sidebar-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px;}
.login-logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-0.5px;}
.login-sub{font-size:12px;color:var(--muted);}
.login-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.login-input{width:100%;background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-family:'DM Mono',monospace;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;}
.login-input:focus{border-color:var(--accent);}
.login-btn{background:var(--accent);color:#0d0d0d;border:none;border-radius:10px;padding:14px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:background .15s;}
.login-btn:hover{background:var(--acch);}
.login-err{color:var(--red);font-size:13px;text-align:center;min-height:18px;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.shake{animation:shake .4s ease;}

/* ── APP SHELL ── */
#app{display:none;height:100vh;overflow:hidden;}
.app-inner{display:flex;height:100%;}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;overflow-y:auto;flex-shrink:0;}
.sb-logo{padding:24px 20px 8px;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--accent);letter-spacing:-0.5px;line-height:1.3;}
.sb-logo-sub{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;font-weight:400;letter-spacing:0;}
.sb-divider{height:1px;background:var(--border);margin:16px 0;}
.sb-section{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 20px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;border-left:3px solid transparent;user-select:none;}
.nav-item:hover{background:var(--raised);color:var(--text);}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(200,240,77,.05);}
.nav-item .nav-icon{font-size:15px;width:18px;text-align:center;}
.sb-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);}
.sb-user{margin-bottom:10px;line-height:1.6;}
.sb-user strong{color:var(--text);display:block;font-size:12px;}
.btn-logout{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;width:100%;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0;}
.module-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;flex:1;}
.header-meta{font-size:11px;color:var(--muted);}
.btn-refresh{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;}
.btn-refresh:hover{border-color:var(--accent);color:var(--accent);}
#content{flex:1;overflow-y:auto;padding:24px;}

/* ── GRID ── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
.full-w{grid-column:1/-1;}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px;}
.card-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;font-family:'DM Mono',monospace;}
.metric-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px;}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.metric-val{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--text);line-height:1;}
.metric-sub{font-size:11px;color:var(--muted);margin-top:6px;}

/* ── INSIGHT CARDS ── */
.insight-card{background:var(--surf);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:20px;margin-bottom:16px;}
.insight-card.p1{border-left-color:var(--red);}
.insight-card.p2{border-left-color:var(--amber);}
.insight-card.p3{border-left-color:var(--blue);}
.insight-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;}
.insight-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.insight-badges{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.badge{font-size:9px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:20px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
.badge-high{background:rgba(77,255,212,.12);color:var(--teal);border:1px solid rgba(77,255,212,.3);}
.badge-med{background:rgba(255,184,77,.12);color:var(--amber);border:1px solid rgba(255,184,77,.3);}
.badge-low{background:rgba(136,136,136,.12);color:var(--muted);border:1px solid rgba(136,136,136,.3);}
.badge-p1{background:rgba(255,90,90,.12);color:var(--red);border:1px solid rgba(255,90,90,.3);}
.badge-p2{background:rgba(255,184,77,.12);color:var(--amber);border:1px solid rgba(255,184,77,.3);}
.badge-p3{background:rgba(90,180,255,.12);color:var(--blue);border:1px solid rgba(90,180,255,.3);}
.insight-metric{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);margin-bottom:12px;}
.insight-sec{margin-bottom:10px;}
.insight-sec-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;}
.insight-sec-text{font-size:13px;color:var(--text);line-height:1.6;}
.insight-impact{font-size:12px;color:var(--green);font-weight:500;margin-top:8px;}
.n-badge{font-size:10px;color:var(--muted);}

/* ── FUNNEL ── */
.funnel-wrap{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 0;}
.funnel-stage{display:flex;align-items:center;gap:10px;width:100%;}
.funnel-bar-wrap{flex:1;position:relative;}
.funnel-bar{height:44px;border-radius:6px;display:flex;align-items:center;padding:0 14px;transition:width .3s;position:relative;min-width:80px;}
.funnel-bar.top{background:rgba(200,240,77,.18);border:1px solid rgba(200,240,77,.3);}
.funnel-bar.mid{background:rgba(90,180,255,.14);border:1px solid rgba(90,180,255,.25);}
.funnel-bar.bot{background:rgba(77,255,212,.14);border:1px solid rgba(77,255,212,.25);}
.funnel-bar.bottleneck{background:rgba(255,90,90,.14);border:1px solid rgba(255,90,90,.3);}
.funnel-bar-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;}
.funnel-bar-count{font-size:11px;color:var(--muted);margin-left:8px;}
.funnel-conv{min-width:70px;text-align:right;font-size:11px;color:var(--muted);}
.funnel-drop{min-width:70px;text-align:right;font-size:11px;}
.funnel-drop.high{color:var(--red);}
.funnel-drop.med{color:var(--amber);}
.funnel-drop.low{color:var(--teal);}

/* ── BAR CHART ── */
.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-key{font-size:12px;color:var(--text);min-width:110px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:22px;background:var(--raised);border-radius:4px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease;display:flex;align-items:center;padding:0 8px;}
.bar-fill.accent{background:rgba(200,240,77,.22);border:1px solid rgba(200,240,77,.4);}
.bar-fill.blue{background:rgba(90,180,255,.2);border:1px solid rgba(90,180,255,.35);}
.bar-fill.teal{background:rgba(77,255,212,.18);border:1px solid rgba(77,255,212,.3);}
.bar-fill.purple{background:rgba(180,142,255,.18);border:1px solid rgba(180,142,255,.3);}
.bar-fill.red{background:rgba(255,90,90,.15);border:1px solid rgba(255,90,90,.3);}
.bar-val{font-size:11px;color:var(--muted);min-width:50px;text-align:right;}
.bar-n{font-size:10px;color:var(--muted);min-width:40px;}

/* ── ICP CARD ── */
.icp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
.icp-item{background:var(--raised);border-radius:8px;padding:12px 14px;}
.icp-item-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.icp-item-val{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.icp-item-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── RISK TABLE ── */
.risk-table{width:100%;border-collapse:collapse;font-size:12px;}
.risk-table th{text-align:left;padding:8px 10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);font-weight:400;}
.risk-table td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.risk-table tr:last-child td{border-bottom:none;}
.risk-table tr:hover td{background:var(--raised);}
.days-pill{display:inline-block;background:rgba(255,90,90,.12);color:var(--red);border:1px solid rgba(255,90,90,.25);border-radius:20px;padding:2px 8px;font-size:10px;}
.days-pill.amber{background:rgba(255,184,77,.12);color:var(--amber);border-color:rgba(255,184,77,.25);}

/* ── OBJECTION TAGS ── */
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.obj-tag{background:var(--raised);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--text);}
.obj-tag span{color:var(--muted);font-size:10px;margin-left:4px;}

/* ── LOADING / ERROR ── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--muted);}
.error-wrap{background:var(--surf);border:1px solid rgba(255,90,90,.3);border-radius:12px;padding:24px;text-align:center;}
.error-msg{color:var(--red);font-size:13px;margin-bottom:14px;}
.btn-retry{background:none;border:1px solid var(--red);border-radius:8px;padding:8px 20px;font-family:'DM Mono',monospace;font-size:12px;color:var(--red);cursor:pointer;transition:all .15s;}
.btn-retry:hover{background:rgba(255,90,90,.08);}

/* ── SECTION HEADER ── */
.section-h{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin:28px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.section-h:first-child{margin-top:0;}

/* ── PLACEHOLDER MODULE ── */
.placeholder-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;text-align:center;padding:40px;}
.placeholder-icon{font-size:48px;opacity:.3;}
.placeholder-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--text);}
.placeholder-sub{font-size:14px;color:var(--muted);max-width:480px;line-height:1.7;}
.placeholder-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:700px;margin-top:24px;}
.placeholder-card{background:var(--surf);border:1px dashed var(--border);border-radius:10px;padding:16px;text-align:left;}
.placeholder-card-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.placeholder-card-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--border);}

/* ── AI SECTION ── */
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ai-badge{background:rgba(180,142,255,.15);color:var(--purple);border:1px solid rgba(180,142,255,.3);border-radius:20px;padding:3px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;}

/* ── MOBILE TOGGLE ── */
.sb-toggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sb-toggle{display:block;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .25s;}
  #sidebar.open{transform:translateX(0);}
  .sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;}
  .sb-overlay.show{display:block;}
  #main{width:100%;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .icp-grid{grid-template-columns:1fr 1fr;}
  .placeholder-cards{grid-template-columns:1fr;}
  .main-header{gap:10px;}
}
</style>
</head>

function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
function pct(n, d) { return d > 0 ? (n / d * 100).toFixed(1) : '0.0'; }
function fmt(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function fmtJOD(n) { return 'JOD ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function confBadge(n) {
  if (n >= 30) return '<span class="badge badge-high">HIGH (n=' + n + ')</span>';
  if (n >= 10) return '<span class="badge badge-med">MEDIUM (n=' + n + ')</span>';
  return '<span class="badge badge-low">LOW (n=' + n + ')</span>';
}

// ═══ GHL API ════════════════════════════════════════════════════
async function ghlFetch(path, opts) {
  opts = opts || {};
  var headers = Object.assign({
    'Authorization': 'Bearer ' + CFG.ghlKey,
    'Version': '2021-07-28',
    'Content-Type': 'application/json',
  }, opts.headers || {});
  var attempts = 0;
  while (attempts < 4) {
    var res = await fetch(CFG.ghlBase + path, Object.assign({}, opts, { headers: headers }));
    if (res.status === 429) { attempts++; await sleep(1500); continue; }
    if (!res.ok) throw new Error('GHL HTTP ' + res.status);
    return res;
  }
  throw new Error('Rate limit exceeded');
}

async function fetchAllContacts(onProgress) {
  var all = [], page = 1, total = null;
  while (true) {
    var res  = await ghlFetch('/contacts/?locationId=' + CFG.ghlLoc + '&limit=100&page=' + page);
    var data = await res.json();
    var batch = data.contacts || [];
    if (total === null && data.meta && data.meta.total) total = data.meta.total;
    all = all.concat(batch);
    if (onProgress) onProgress(all.length, total);
    if (!batch.length || batch.length < 100) break;
    if (total !== null && all.length >= total) break;
    page++;
  }
  return all;
}

// ═══ DATA HELPERS ════════════════════════════════════════════════
function getField(contact, key) {
  var fields = contact.customFields || contact.custom_fields || [];
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i];
    if (f.key === key || f.fieldKey === key) return f.value || f.fieldValue || null;
  }
  return null;
}

function hasTag(contact, tag) { return (contact.tags || []).indexOf(tag) !== -1; }

function cName(c) {
  return (((c.firstName || '') + ' ' + (c.lastName || '')).trim()) || c.email || 'Unknown';
}

var EXCLUDE_TAGS = ['archived', 'group', 'low-priority', 'new-lead', 'free-trial'];
var STAGE_TAGS   = ['client','lost-client','lost','cold','re-engage','meeting-done','site-visit','meeting-booked','contacted'];

function filterContacts(contacts) {
  return contacts.filter(function(c) {
    var tags = c.tags || [];
    if (EXCLUDE_TAGS.some(function(t){ return tags.indexOf(t) !== -1; })) return false;
    return STAGE_TAGS.some(function(t){ return tags.indexOf(t) !== -1; });
  });
}

// ═══ COMPUTATIONS ════════════════════════════════════════════════

function computePipeline(contacts) {
  function cnt(pred) { return contacts.filter(pred).length; }
  var has = hasTag;
  var stages = [
    { label: 'Total Leads',     count: contacts.length },
    { label: 'Contacted',       count: cnt(function(c){ return has(c,'contacted')||has(c,'meeting-booked')||has(c,'meeting-done')||has(c,'site-visit')||has(c,'client')||has(c,'lost-client'); }) },
    { label: 'Meeting Booked',  count: cnt(function(c){ return has(c,'meeting-booked')||has(c,'meeting-done')||has(c,'site-visit')||has(c,'client')||has(c,'lost-client'); }) },
    { label: 'Meeting Done',    count: cnt(function(c){ return has(c,'meeting-done')||has(c,'site-visit')||has(c,'client')||has(c,'lost-client'); }) },
    { label: 'Site Visit',      count: cnt(function(c){ return has(c,'site-visit')||has(c,'client')||has(c,'lost-client'); }) },
    { label: 'Closed',          count: cnt(function(c){ return has(c,'client')||has(c,'lost-client'); }) },
  ];
  stages[0].convRate = '100.0'; stages[0].dropOff = 0;
  var maxDrop = 0, bottleneckIdx = 1;
  for (var i = 1; i < stages.length; i++) {
    var prev = stages[i-1].count, curr = stages[i].count;
    stages[i].convRate = pct(curr, prev);
    stages[i].dropOff  = prev > 0 ? parseFloat(((1 - curr/prev)*100).toFixed(1)) : 0;
    if (stages[i].dropOff > maxDrop) { maxDrop = stages[i].dropOff; bottleneckIdx = i; }
  }
  return { stages: stages, bottleneckIdx: bottleneckIdx };
}

function computeCloseRate(contacts, fieldKey) {
  var groups = {};
  var pool = contacts.filter(function(c){ return hasTag(c,'client')||hasTag(c,'lost-client')||hasTag(c,'lost'); });
  pool.forEach(function(c) {
    var v = getField(c, fieldKey) || 'unknown';
    if (!groups[v]) groups[v] = { won: 0, total: 0 };
    groups[v].total++;
    if (hasTag(c,'client')) groups[v].won++;
  });
  return Object.keys(groups)
    .map(function(k) { return { key: k, won: groups[k].won, total: groups[k].total, rate: parseFloat(pct(groups[k].won, groups[k].total)) }; })
    .sort(function(a,b){ return b.rate - a.rate; });
}

function computeLostReasons(contacts) {
  var lost = contacts.filter(function(c){ return hasTag(c,'lost')||hasTag(c,'cold')||hasTag(c,'re-engage')||hasTag(c,'lost-client'); });
  var counts = {}, total = 0;
  lost.forEach(function(c) {
    var r = getField(c,'contact.lost_reason'); if (!r) return;
    r.split(',').forEach(function(p) {
      p = p.trim(); if (!p) return;
      counts[p] = (counts[p]||0) + 1; total++;
    });
  });
  return {
    reasons: Object.keys(counts).map(function(k){ return { reason: k, count: counts[k], pct: parseFloat(pct(counts[k],total)) }; })
      .sort(function(a,b){ return b.count - a.count; }),
    total: total, n: lost.length,
  };
}

function computeObjections(contacts) {
  var stop = new Set(['the','and','but','for','that','this','with','from','they','have','were','what','their','about','said','which','into','there','when','more','will','been','each','some','also','than','your','then','would','could','should','very','just']);
  var words = {}, n = 0;
  contacts.forEach(function(c) {
    var obj = getField(c,'contact.objection'); if (!obj) return; n++;
    obj.toLowerCase().split(/\W+/).forEach(function(w) {
      if (w.length < 4 || stop.has(w)) return;
      words[w] = (words[w]||0) + 1;
    });
  });
  return { topWords: Object.keys(words).map(function(w){ return { word: w, count: words[w] }; }).sort(function(a,b){ return b.count-a.count; }).slice(0,20), n: n };
}

function computeRevenue(contacts) {
  var clients = contacts.filter(function(c){ return hasTag(c,'client'); });
  var total = 0, count = 0, bySpec = {}, bySrc = {};
  clients.forEach(function(c) {
    var v = parseFloat(getField(c,'contact.monthly_value')); if (isNaN(v)||v<=0) return;
    total += v; count++;
    var sp = getField(c,'contact.clinic_specialty')||'unknown'; bySpec[sp] = (bySpec[sp]||0)+v;
    var sr = getField(c,'contact.lead_source')||'unknown';     bySrc[sr]  = (bySrc[sr]||0)+v;
  });
  return {
    mrr: total, avg: count>0?total/count:0, clientCount: clients.length, withValue: count,
    bySpec: Object.keys(bySpec).map(function(k){ return { key:k, val:bySpec[k] }; }).sort(function(a,b){ return b.val-a.val; }),
    bySrc:  Object.keys(bySrc).map(function(k){ return { key:k, val:bySrc[k] }; }).sort(function(a,b){ return b.val-a.val; }),
  };
}

function computeICP(contacts) {
  var clients = contacts.filter(function(c){ return hasTag(c,'client'); });
  if (!clients.length) return null;
  function top(field) {
    var freq = {};
    clients.forEach(function(c){ var v=getField(c,field)||'unknown'; freq[v]=(freq[v]||0)+1; });
    return Object.keys(freq).map(function(k){ return [k,freq[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  }
  var specs = top('contact.clinic_specialty');
  var cities = top('contact.lead_city');
  var srcs   = top('contact.lead_source');
  var vals = clients.map(function(c){ return parseFloat(getField(c,'contact.monthly_value')); }).filter(function(v){ return !isNaN(v)&&v>0; });
  var avg = vals.length ? vals.reduce(function(a,b){ return a+b; },0)/vals.length : 0;
  return { n: clients.length, topSpec: specs[0]||['—',0], topCity: cities[0]||['—',0], topSrc: srcs[0]||['—',0], avg: avg, specs: specs.slice(0,5), cities: cities.slice(0,5), srcs: srcs.slice(0,5) };
}

function computeRisk(contacts) {
  var now = Date.now();
  return contacts
    .filter(function(c){ return hasTag(c,'cold')||hasTag(c,'re-engage'); })
    .map(function(c) {
      var ds = getField(c,'contact.discovery_call_date');
      var days = null;
      if (ds) { var d = new Date(ds); if (!isNaN(d.getTime())) days = Math.floor((now-d.getTime())/86400000); }
      return { name: cName(c), spec: getField(c,'contact.clinic_specialty')||'—', city: getField(c,'contact.lead_city')||'—', days: days, objection: getField(c,'contact.objection')||'—', tags: (c.tags||[]).filter(function(t){ return ['cold','re-engage'].indexOf(t)!==-1; }), value: parseFloat(getField(c,'contact.monthly_value'))||0 };
    })
    .filter(function(r){ return r.days!==null && r.days>30; })
    .sort(function(a,b){ return b.days-a.days; })
    .slice(0,10);
}

// ═══ RENDERERS ═══════════════════════════════════════════════════

function renderFunnel(pipeline) {
  var max = pipeline.stages[0].count || 1;
  var rows = pipeline.stages.map(function(s, i) {
    var w = Math.max(20, Math.round(s.count / max * 100));
    var colorClass = i === 0 ? 'top' : i === pipeline.stages.length-1 ? 'bot' : i === pipeline.bottleneckIdx ? 'bottleneck' : 'mid';
    var dropHtml = '';
    if (i > 0) {
      var d = s.dropOff;
      var dc = d >= 50 ? 'high' : d >= 30 ? 'med' : 'low';
      dropHtml = '<div class="funnel-drop ' + dc + '">&minus;' + d + '%</div>';
    }
    return '<div class="funnel-stage">' +
      '<div class="funnel-bar-wrap"><div class="funnel-bar ' + colorClass + '" style="width:' + w + '%">' +
      '<span class="funnel-bar-label">' + esc(s.label) + '</span>' +
      '<span class="funnel-bar-count">' + s.count + '</span>' +
      '</div></div>' +
      '<div class="funnel-conv">' + (i===0?'—':s.convRate+'%') + '</div>' +
      dropHtml +
      '</div>';
  }).join('');
  return '<div class="funnel-wrap">' + rows + '</div>';
}

function renderBarChart(rows, colors) {
  if (!rows || !rows.length) return '<div style="color:var(--muted);font-size:12px">No data</div>';
  colors = colors || ['accent','blue','teal','purple','red'];
  var maxVal = Math.max.apply(null, rows.map(function(r){ return r.val||r.rate||0; }));
  return '<div class="bar-chart">' + rows.map(function(r, i) {
    var val = r.val !== undefined ? r.val : r.rate;
    var displayVal = r.displayVal !== undefined ? r.displayVal : (r.val !== undefined ? fmtJOD(r.val) : r.rate + '%');
    var w = maxVal > 0 ? Math.max(4, Math.round(val/maxVal*100)) : 0;
    var c = colors[i % colors.length];
    return '<div class="bar-row">' +
      '<div class="bar-key" title="' + esc(r.key) + '">' + esc(r.key) + '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + c + '" style="width:' + w + '%"></div></div>' +
      '<div class="bar-val">' + esc(String(displayVal)) + '</div>' +
      '<div class="bar-n">' + (r.n ? 'n='+r.n : r.total ? 'n='+r.total : '') + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

function insightCard(cfg) {
  var urgencyClass = cfg.urgency === 'P1' ? 'p1' : cfg.urgency === 'P2' ? 'p2' : cfg.urgency === 'P3' ? 'p3' : '';
  var urgBadge = cfg.urgency ? '<span class="badge badge-' + cfg.urgency.toLowerCase() + '">' + cfg.urgency + '</span>' : '';
  return '<div class="insight-card ' + urgencyClass + '">' +
    '<div class="insight-header">' +
      '<div class="insight-title">' + esc(cfg.title) + '</div>' +
      '<div class="insight-badges">' + urgBadge + (cfg.conf||'') + '</div>' +
    '</div>' +
    (cfg.metric ? '<div class="insight-metric">' + esc(cfg.metric) + '</div>' : '') +
    (cfg.chart  ? cfg.chart : '') +
    (cfg.insight ? '<div class="insight-sec"><div class="insight-sec-label">Insight</div><div class="insight-sec-text">' + esc(cfg.insight) + '</div></div>' : '') +
    (cfg.action  ? '<div class="insight-sec"><div class="insight-sec-label">Action</div><div class="insight-sec-text">' + esc(cfg.action) + '</div></div>' : '') +
    (cfg.impact  ? '<div class="insight-impact">&#x25B2; ' + esc(cfg.impact) + '</div>' : '') +

}

    // Revenue breakdown
    html += '<div class="section-h">Revenue Analysis</div>';
    html += '<div class="grid-2">';
    html += '<div class="card"><div class="card-title">MRR by Specialty ' + confBadge(rev.withValue) + '</div>' + renderBarChart(specBars, ['accent','blue','teal','purple','red']) + '</div>';
    html += '<div class="card"><div class="card-title">MRR by Source ' + confBadge(rev.withValue) + '</div>' + renderBarChart(srcBars, ['blue','teal','accent','purple','red']) + '</div>';
    html += '</div>';

    // ICP
    if (icp) {
      html += '<div class="section-h">Ideal Client Profile</div>';
      html += insightCard({
        title: 'YOUR BEST CLIENT LOOKS LIKE…',
        conf: confBadge(icp.n),
        chart: icpHtml,
        insight: 'Based on ' + icp.n + ' active clients, your ideal client is a ' + icp.topSpec[0] + ' clinic in ' + icp.topCity[0] + ' acquired via ' + icp.topSrc[0] + '. They represent ' + fmtJOD(icp.avg) + '/month and ' + fmtJOD(icp.avg*12) + '/year in revenue.',
        action: 'Align your Meta Ads creative, targeting, and outreach to this profile. Create a dedicated case study for ' + icp.topSpec[0] + ' clinics in ' + icp.topCity[0] + '.',
        impact: 'Each additional client matching this profile adds ' + fmtJOD(icp.avg) + '/mo to MRR.',
        urgency: 'P2',
      });
    }

    // Lost reasons
    html += '<div class="section-h">Lost Deal Analysis</div>';
    html += '<div class="grid-2">';
    html += '<div class="card"><div class="card-title">Lost Reasons ' + confBadge(lostR.n) + '</div>' + renderBarChart(lostBars, ['red','amber','purple','blue','teal']) + '</div>';
    html += '<div class="card"><div class="card-title">Objection Keywords ' + confBadge(objs.n) + '</div>' + objHtml + '</div>';
    html += '</div>';

    // At-risk leads
    html += '<div class="section-h">At-Risk Leads (Cold &gt;30 Days)</div>';
    html += '<div class="card">' + riskHtml + '</div>';

    // AI Analysis section
    html += '<div class="section-h"><div class="ai-header"><span>AI Strategic Insights</span><span class="ai-badge">&#x2734; Claude</span></div></div>';
    html += '<div id="ai-section"><div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Generating strategic insights…</div></div></div>';

    content.innerHTML = html;

    // Trigger AI analysis asynchronously
    var metrics = {
      totalContacts: contacts.length, clients: clients.length, mrr: rev.mrr, avgClientValue: rev.avg,
      closeRate: closeRatePct, atRiskLeads: risk.length,
      pipeline: pipeline.stages.map(function(s){ return { label: s.label, count: s.count, dropOff: s.dropOff }; }),
      topSource: bySrc[0] || null, topSpecialty: bySpec[0] || null, topCity: byCity[0] || null,
      bottleneck: { from: bottlePrev.label, to: bottle.label, dropOff: bottle.dropOff },
      topLostReasons: lostR.reasons.slice(0,5),
      icp: icp,
    };
    callAI(metrics).then(function(insights) {
      var aiEl = document.getElementById('ai-section');
      if (!aiEl) return;
      if (!insights || !insights.length) {
        aiEl.innerHTML = '<div class="error-wrap"><div class="error-msg">AI analysis unavailable. Configure an Anthropic API key in localStorage (key: tui_ai_key) or run via Claude artifact.</div></div>';
        return;
      }
      aiEl.innerHTML = insights.map(function(ins) {
        return insightCard({
          title:   ins.title || 'Insight',
          metric:  ins.signal || '',
          insight: (ins.evidence ? ins.evidence + ' ' : '') + (ins.cause || '') + (ins.effect ? ' → ' + ins.effect : ''),
          action:  ins.action || '',
          impact:  ins.estimated_jod_impact ? 'Est. impact: ' + ins.estimated_jod_impact : '',
          conf:    ins.confidence_score ? '<span class="badge badge-' + (ins.confidence_score>=70?'high':ins.confidence_score>=40?'med':'low') + '">' + ins.confidence_score + '/100</span>' : '',
          urgency: ins.urgency || 'P2',
        });
      }).join('');
    });

  } catch(e) {
    content.innerHTML = '<div class="error-wrap"><div class="error-msg">Error: ' + esc(e.message) + '</div><button class="btn-retry" onclick="loadSalesModule(true)">&#x21BB; Retry</button></div>';
  }
}

// ═══ AI CALL ════════════════════════════════════════════════════
async function callAI(metrics) {
  var apiKey = localStorage.getItem('tui_ai_key') || '';
  var headers = {
    'Content-Type': 'application/json',
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true',
  };
  if (apiKey) headers['x-api-key'] = apiKey;

  var system = 'You are ThreeUp Solutions\' strategic intelligence analyst. ThreeUp is a B2B medical clinic marketing agency in Jordan. You think in terms of CAUSE → EFFECT → BUSINESS IMPACT → ACTION. Never give generic observations. Every insight must be specific, commercial, and actionable. Output in JSON array of insight objects.';
  var user   = 'Here is the sales data for ThreeUp Solutions: ' + JSON.stringify(metrics) + '\nGenerate 5 strategic insights. Each must have: title, signal, evidence, cause, effect, action, estimated_jod_impact, confidence_score (0-100), urgency (P1/P2/P3).\nRespond with ONLY a JSON array, no markdown, no preamble.';

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        model: CFG.aiModel,
        max_tokens: 2000,
        system: system,
        messages: [{ role: 'user', content: user }],
      }),
    });
    if (!res.ok) return null;
    var data = await res.json();
    var text = data.content && data.content[0] && data.content[0].text;
    if (!text) return null;
    return JSON.parse(text);
  } catch(e) {
    console.warn('[Intel] AI call failed:', e.message);
    return null;
  }
}

function loadModule(name, force) {
  _activeModule = name;
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.module === name);
  });
  closeSidebar();
  if (name === 'sales')     loadSalesModule(force);
  else if (name === 'retention') loadRetentionModule();
  else if (name === 'content')   loadContentModule();
  else if (name === 'ceo')       loadCEOModule();
}

// ═══ LOGIN ══════════════════════════════════════════════════════
function initLogin() {
  var inp = document.getElementById('pw-input');
  var btn = document.getElementById('login-btn');
  var err = document.getElementById('login-err');

  function attempt() {
    var pw = inp.value.trim();
    var user = PASSWORDS[pw];
    if (user) {
      setSession(user);
      showApp(user);
    } else {
      err.textContent = 'Access denied.';
      inp.classList.add('shake');
      inp.addEventListener('animationend', function() { inp.classList.remove('shake'); }, { once: true });
      inp.select();
    }
  }

  btn.addEventListener('click', attempt);
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') attempt(); });
}

function showApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sb-user-name').textContent = user.charAt(0).toUpperCase() + user.slice(1);
  loadModule('sales');
}

// ═══ EVENT WIRING ════════════════════════════════════════════════
document.querySelectorAll('.nav-item').forEach(function(el) {
  el.addEventListener('click', function() { loadModule(el.dataset.module); });
});

document.getElementById('logout-btn').addEventListener('click', function() {
  clearSession();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-err').textContent = '';

});

document.getElementById('refresh-btn').addEventListener('click', function() {

});

document.getElementById('sb-toggle').addEventListener('click', openSidebar);
document.getElementById('sb-overlay').addEventListener('click', closeSidebar);

// ═══ INIT ════════════════════════════════════════════════════════
(function init() {
  initLogin();
  var sess = getSession();
  if (sess && sess.authenticated && sess.user) {
    showApp(sess.user);
  }
})();
