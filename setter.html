<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreeUp — Setter Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--purple:#A396DC;--purple-light:#c4b9f0;--purple-dark:#7b6ec4;--white:#fff;--off-white:#fafafa;--text:#1a1a1a;--muted:#6b6b6b;--border:#e5e5e5;--green:#4dff91;--green-dark:#00cc5a;--red:#ff5a5a;--red-dark:#cc2222;--amber:#ffb84d;--amber-dark:#e69500;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Mono',monospace;background:var(--off-white);color:var(--text);min-height:100vh;font-size:13px;}
h1,h2,h3,.logo{font-family:'Syne',sans-serif;}
.hidden{display:none!important;}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,150,220,.4)}70%{box-shadow:0 0 0 8px rgba(163,150,220,0)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--purple);color:#fff;}.btn-primary:hover{background:var(--purple-dark);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-ghost:hover{background:var(--border);color:var(--text);}
.btn-green{background:var(--green);color:#000;}.btn-green:hover{background:var(--green-dark);color:#fff;}
.btn-red{background:var(--red);color:#fff;}.btn-red:hover{background:var(--red-dark);}
.btn-amber{background:var(--amber);color:#000;}.btn-amber:hover{background:var(--amber-dark);}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0eeff 0%,#fafafa 60%,#fff 100%);}
.login-card{background:#fff;border-radius:20px;padding:48px 40px;box-shadow:0 8px 40px rgba(163,150,220,.18),0 2px 8px rgba(0,0,0,.06);width:360px;text-align:center;}
.login-logo{font-size:28px;font-weight:800;color:var(--purple);margin-bottom:6px;}
.login-sub{color:var(--muted);font-size:12px;margin-bottom:32px;}
.login-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Mono',monospace;font-size:14px;outline:none;transition:border-color .15s;background:var(--off-white);letter-spacing:3px;text-align:center;margin-bottom:12px;}
.login-input:focus{border-color:var(--purple);background:#fff;}
.login-error{color:var(--red);font-size:11px;margin-bottom:10px;min-height:16px;}
.login-btn{width:100%;padding:13px;font-size:14px;border-radius:10px;margin-top:4px;justify-content:center;}

/* TOPBAR */
#topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.topbar-logo{font-size:20px;font-weight:800;color:var(--purple);}
.topbar-date{font-size:12px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.setter-name-display{font-size:12px;color:var(--text);cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid transparent;transition:all .15s;}
.setter-name-display:hover{border-color:var(--border);background:var(--off-white);}
.setter-name-input{font-family:'DM Mono',monospace;font-size:12px;padding:4px 8px;border:1px solid var(--purple);border-radius:6px;outline:none;width:140px;}
.sync-badge{font-size:10px;padding:3px 8px;border-radius:10px;background:var(--off-white);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:4px;}
.sync-badge.syncing{border-color:var(--purple-light);color:var(--purple);}
.sync-badge.synced{border-color:#b0f0cc;color:var(--green-dark);background:#f0fff6;}
.sync-badge.local{border-color:#ffd98a;color:var(--amber-dark);background:#fff8e0;}
.export-logs-btn{font-size:10px;padding:3px 10px;border-radius:10px;background:var(--amber);border:none;color:#000;cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;transition:background .15s;}
.export-logs-btn:hover{background:var(--amber-dark);color:#fff;}
.logout-btn{font-size:11px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:none;transition:all .15s;}
.logout-btn:hover{color:var(--red);border-color:var(--red);}

/* DASHBOARD */
#dashboard{padding:20px 24px;max-width:1400px;margin:0 auto;}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.dash-title{font-size:18px;font-weight:800;}
.dash-stats{display:flex;gap:10px;}
.stat-pill{background:#fff;border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.stat-pill strong{color:var(--text);}
.priority-section{margin-bottom:24px;}
.section-header{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:10px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;}
.section-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.section-dot.urgent{background:var(--red);}
.section-dot.scheduled{background:var(--amber);}
.section-dot.warm{background:var(--green-dark);}
.section-dot.cold{background:#aaa;}
.section-title{font-weight:800;font-size:13px;letter-spacing:.5px;}
.section-count{background:var(--off-white);border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--muted);}
.section-chevron{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .2s;}
.section-body{display:flex;flex-direction:column;gap:8px;}
.section-body.collapsed{display:none;}
.section-empty{text-align:center;padding:24px;color:var(--muted);font-size:12px;border:1px dashed var(--border);border-radius:10px;}

/* LEAD CARDS */
.lead-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.lead-card:hover{box-shadow:0 4px 12px rgba(163,150,220,.15);border-color:var(--purple-light);transform:translateY(-1px);}
.lead-card.pulsing{animation:pulse 1.5s ease infinite;border-color:var(--red);}
.lead-card-main{flex:1;min-width:0;}
.lead-name{font-weight:700;font-size:14px;font-family:'Syne',sans-serif;margin-bottom:3px;}
.lead-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.lead-status-pill{padding:2px 10px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;}
.pill-urgent{background:#fff0f0;color:var(--red);border:1px solid #ffd0d0;}
.pill-warm{background:#f0fff6;color:var(--green-dark);border:1px solid #b0f0cc;}
.pill-cold{background:#f5f5f5;color:var(--muted);border:1px solid var(--border);}
.pill-scheduled{background:#fff8e0;color:var(--amber-dark);border:1px solid #ffd98a;}
.pill-contacted{background:#f0f0ff;color:var(--purple-dark);border:1px solid var(--purple-light);}
.callback-badge{font-size:10px;color:var(--amber-dark);background:#fff8e0;border:1px solid #ffd98a;border-radius:6px;padding:2px 7px;}
.na-badge{font-size:10px;color:var(--red);background:#fff0f0;border:1px solid #ffd0d0;border-radius:6px;padding:2px 7px;}

/* LEAD DETAIL */
#lead-detail{position:fixed;inset:0;background:var(--off-white);z-index:200;display:flex;flex-direction:column;overflow:hidden;}
#lead-detail-inner{flex:1;display:flex;overflow:hidden;}
.detail-topbar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;flex-shrink:0;}
.detail-lead-title{font-weight:800;font-size:15px;font-family:'Syne',sans-serif;}
.timer-display{margin-left:auto;font-size:11px;color:var(--muted);background:var(--off-white);padding:4px 10px;border-radius:8px;border:1px solid var(--border);}
.timer-display.slow{color:var(--amber-dark);border-color:#ffd98a;}

/* LEFT COL */
.detail-left{width:25%;min-width:240px;max-width:320px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
.detail-section-title{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.info-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;}
.info-row a{color:var(--purple);text-decoration:none;}
.info-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.divider{border:none;border-top:1px solid var(--border);}
.timeline-item{display:flex;gap:10px;align-items:flex-start;font-size:11px;margin-bottom:8px;}
.timeline-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:4px;}
.timeline-dot.done{background:var(--green-dark);}
.timeline-dot.today{background:var(--red);}
.adnan-notes{background:#f8f6ff;border:1px solid var(--purple-light);border-radius:10px;padding:12px;font-size:12px;line-height:1.6;}

/* CENTER COL */
.detail-center{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
.script-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.script-label{font-size:10px;color:var(--purple);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.script-text{direction:rtl;text-align:right;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:15px;line-height:2;color:var(--text);white-space:pre-wrap;}
.script-placeholder{color:var(--purple);font-weight:600;}
.variant-item{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;}
.variant-toggle{width:100%;background:var(--off-white);border:none;padding:10px 14px;text-align:left;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;transition:background .15s;}
.variant-toggle:hover{background:var(--border);}
.variant-body{padding:14px;display:none;}
.variant-body.open{display:block;}
.variant-text{direction:rtl;text-align:right;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:13px;line-height:1.9;white-space:pre-wrap;}

/* RIGHT COL */
.detail-right{width:25%;min-width:220px;max-width:300px;background:#fff;border-left:1px solid var(--border);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
.outcome-btn{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);display:flex;align-items:center;gap:8px;transition:all .15s;text-align:left;}
.outcome-btn:hover{border-color:var(--purple-light);background:#f8f6ff;color:var(--purple-dark);}
.outcome-btn.primary{border-color:var(--purple);color:var(--purple-dark);background:#f8f6ff;}
.outcome-btn.primary:hover{background:var(--purple);color:#fff;}
.outcome-sep{border:none;border-top:1px solid var(--border);margin:4px 0;}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal{background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.15);width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-weight:800;font-size:16px;font-family:'Syne',sans-serif;margin-bottom:6px;}
.modal-sub{color:var(--muted);font-size:11px;margin-bottom:20px;}
.modal-field{margin-bottom:16px;}
.modal-label{font-size:11px;color:var(--muted);margin-bottom:6px;display:block;font-weight:500;}
.modal-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .15s;background:var(--off-white);}
.modal-input:focus{border-color:var(--purple);background:#fff;}
.modal-select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:13px;outline:none;background:var(--off-white);cursor:pointer;}
.checkbox-item{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;margin-bottom:8px;}
.checkbox-item input{accent-color:var(--purple);width:14px;height:14px;cursor:pointer;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;justify-content:center;}
.info-box{background:var(--off-white);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);margin-bottom:16px;}
.info-box strong{color:var(--text);}
.warning-box{background:#fff8e0;border:1px solid #ffd98a;border-radius:8px;padding:12px;font-size:12px;color:var(--amber-dark);margin-bottom:16px;}
.error-box{background:#fff0f0;border:1px solid #ffd0d0;border-radius:8px;padding:12px;font-size:12px;color:var(--red);}

/* TOAST */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:fadeIn .2s ease;max-width:320px;}
.toast.success{background:#0a7a3a;}
.toast.error{background:var(--red-dark);}
.toast.warning{background:var(--amber-dark);color:#000;}

/* LOADING */
#loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.big-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;}

/* NAME PROMPT */
#name-prompt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.name-prompt-card{background:#fff;border-radius:16px;padding:32px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.15);text-align:center;}

/* NOTIF BELL */
.notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff;}
.notif-wrap{position:relative;display:inline-block;}

/* VIEW TABS */
.view-tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;}
.view-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:12px 20px;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;margin-bottom:-1px;transition:all .15s;letter-spacing:.3px;}
.view-tab:hover{color:var(--text);}
.view-tab.active{color:var(--purple);border-bottom-color:var(--purple);}

/* PERFORMANCE */
.perf-wrap{padding:20px 24px;max-width:1200px;margin:0 auto;}
.perf-section{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.perf-section-title{font-weight:800;font-size:14px;font-family:'Syne',sans-serif;margin-bottom:16px;}
.perf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.perf-stat{background:var(--off-white);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.perf-num{font-size:26px;font-weight:800;font-family:'Syne',sans-serif;margin-bottom:4px;line-height:1;}
.perf-label{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;line-height:1.3;}
.flag-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:6px;}
.flag-red{background:#fff0f0;border:1px solid #ffd0d0;}
.flag-amber{background:#fff8e0;border:1px solid #ffd98a;}
.flag-green{background:#f0fff6;border:1px solid #b0f0cc;}
.flag-count{font-size:20px;font-weight:800;font-family:'Syne',sans-serif;min-width:32px;text-align:center;}
.flag-red .flag-count{color:var(--red);}
.flag-amber .flag-count{color:var(--amber-dark);}
.flag-green .flag-count{color:var(--green-dark);}
.flag-label{font-weight:600;flex:1;}
.flag-detail{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px;}
.lb-row{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;}
.lb-row.top{background:#f8f6ff;border-color:var(--purple-light);}
.lb-rank{font-size:22px;width:32px;text-align:center;}
.lb-name{flex:1;font-weight:700;font-family:'Syne',sans-serif;}
.lb-stats{display:flex;gap:20px;}
.lb-stat{text-align:center;}
.lb-stat-num{font-size:18px;font-weight:800;font-family:'Syne',sans-serif;}
.lb-stat-label{font-size:10px;color:var(--muted);}

/* SCRIPT OPENER & SCENARIO CARDS */
.script-opener-block{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.script-opener-text{direction:rtl;text-align:right;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:19px;font-weight:700;line-height:2;color:var(--text);}
.script-bridge-text{direction:rtl;text-align:right;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.9;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.scenario-cards-wrap{display:flex;flex-direction:column;gap:10px;}
.scenario-card{border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);}
.scenario-card.sc-blue{border-left-color:#3b82f6;}
.scenario-card.sc-orange{border-left-color:#f97316;}
.scenario-card.sc-green{border-left-color:#22c55e;}
.scenario-card.sc-red{border-left-color:#ef4444;}
.scenario-card-toggle{width:100%;background:var(--off-white);border:none;padding:11px 14px;text-align:right;cursor:pointer;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:14px;color:var(--text);display:flex;justify-content:space-between;align-items:center;direction:rtl;transition:background .15s;gap:8px;}
.scenario-card-toggle:hover{background:var(--border);}
.scenario-card-toggle .sc-chevron{font-size:11px;color:var(--muted);flex-shrink:0;}
.scenario-card-body{padding:14px 16px;display:none;direction:rtl;text-align:right;}
.scenario-card-body.open{display:block;}
.scenario-card-text{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:15px;line-height:2;color:var(--text);white-space:pre-wrap;}
/* OUTREACH INNER TABS */
.script-inner-tabs{display:flex;background:var(--off-white);border-bottom:1px solid var(--border);border-radius:14px 14px 0 0;overflow:hidden;}
.script-inner-tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;padding:11px 14px;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;}
.script-inner-tab:hover{color:var(--text);}
.script-inner-tab.active{color:var(--purple);border-bottom-color:var(--purple);background:#fff;}
.outreach-panel{display:none;padding:20px;}
.outreach-panel.active{display:block;}
.switch-to-doctor-btn{margin-top:14px;padding:10px 16px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s;direction:rtl;}
.switch-to-doctor-btn:hover{background:var(--purple-dark);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card fade-in">
    <div class="login-logo">ThreeUp</div>
    <div class="login-sub">Setter Dashboard · Daily Command Center</div>
    <input type="password" id="login-pw" class="login-input" placeholder="••••••••" autocomplete="current-password">
    <div class="login-error" id="login-error"></div>
    <button class="btn btn-primary login-btn" onclick="doLogin()">Enter Dashboard</button>
  </div>
</div>

<!-- NAME PROMPT -->
<div id="name-prompt-overlay" class="hidden">

function updateSyncBadge() {
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  const logs = JSON.parse(localStorage.getItem('activityLog') || '[]');
  const unsynced = logs.filter(l => !l.synced).length;
  badge.className = 'sync-badge local';
  badge.textContent = unsynced > 0
    ? `📥 ${unsynced} log${unsynced>1?'s':''} saved locally`
    : '📥 Logs saved locally';
}

function exportLocalLogs() {
  const logs = JSON.parse(localStorage.getItem('activityLog') || '[]');
  if (!logs.length) { toast('No logs to export yet','warning'); return; }
  const headers = ['Timestamp','Setter','Lead ID','Lead Name','Action','Time On Lead (s)','Suspicious','Flag Reason','Metadata'];
  const rows = logs.map(l => [
    l.timestamp||'', l.setter||'', l.leadId||'', l.leadName||'',
    l.action||'', l.timeOnLead||0, l.suspicious?'YES':'NO',
    l.reason||'', JSON.stringify(l.metadata||{})
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `threeup-setter-log-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${logs.length} log entries as CSV`, 'success');
}

function startCallbackChecker() {
  if (cbCheckId) clearInterval(cbCheckId);
  cbCheckId = setInterval(checkUpcomingCallbacks, 60000);
}

function checkUpcomingCallbacks() {
  const now = new Date();
  const soon = new Date(now.getTime() + 15 * 60 * 1000); // +15 min
  const urgent = [];

  for (const c of allContacts) {
    const cb = getCallbackTime(c);
    if (!cb) continue;
    if (cb >= now && cb <= soon) urgent.push(c);
  }

  for (const c of urgent) {
    const name = getContactName(c);
    const cb = getCallbackTime(c);
    const mins = Math.round((cb - now) / 60000);

    // Browser notification
    if (Notification.permission === 'granted') {
      new Notification(`ThreeUp: Callback Due`, {
        body: `Dr. ${name} — callback in ${mins} minute${mins !== 1 ? 's' : ''}`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%23A396DC"/></svg>'
      });
    }

    // Flash card
    const cards = document.querySelectorAll('.lead-card');
    cards.forEach(el => {
      if (el.dataset.id === c.id) el.classList.add('pulsing');
    });
    toast(`📅 Callback: ${name} in ${mins} min`, 'warning');
  }
}

async function fetchAllCleanedContacts() {
  const all = [];
  let searchAfter = null;
  for (let i = 0; i < 30; i++) {
    const body = {
      locationId: 'ck8gYVHUEnLEIg0OVsLd',
      pageLimit: 100
    };
    if (searchAfter) body.searchAfter = searchAfter;
    let res;
    try {
      res = await fetch('https://services.leadconnectorhq.com/contacts/search', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer pit-5fe4c7a5-aa93-4b13-a034-4ac42ffba273',
          'Version': '2021-07-28',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
    } catch (e) {
      console.warn('[GHL] network error page', i, e);
      break;
    }
    if (!res.ok) {
      const txt = await res.text();
      console.warn('[GHL] page', i, 'status', res.status, txt);
      break;
    }
    const data = await res.json();
    const contacts = data.contacts || [];
    console.log('[GHL] page', i, ':', contacts.length, 'returned');
    if (contacts.length === 0) break;
    const cleaned = contacts.filter(c => c.tags && c.tags.includes('cleanup-done'));
    all.push(...cleaned);
    const last = contacts[contacts.length - 1];
    if (!last.searchAfter) break;
    searchAfter = last.searchAfter;
    if (all.length >= (data.total || 99999)) break;
  }
  console.log('[GHL] TOTAL fetched:', all.length);
  return all;
}

async function ghlUpdateContact(contactId, body) {
  const res = await fetch(`${CFG.ghlBase}/contacts/${contactId}`, {
    method: 'PUT', headers: GHL_HEADERS(), body: JSON.stringify(body)
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`GHL update failed (${res.status}): ${txt}`);
  }
  return res.json();
}

async function ghlAddTag(contactId, tag) {
  const res = await fetch(`${CFG.ghlBase}/contacts/${contactId}/tags`, {
    method: 'POST', headers: GHL_HEADERS(), body: JSON.stringify({tags:[tag]})
  });
  if (!res.ok) throw new Error(`Tag add failed (${res.status})`);
  return res.json();
}

async function ghlRemoveTag(contactId, tag) {
  const res = await fetch(`${CFG.ghlBase}/contacts/${contactId}/tags`, {
    method: 'DELETE', headers: GHL_HEADERS(), body: JSON.stringify({tags:[tag]})
  });
  if (!res.ok) throw new Error(`Tag remove failed (${res.status})`);
}

async function ghlRefreshContact(contactId) {
  try {
    const res = await fetch(`${CFG.ghlBase}/contacts/${contactId}`, {headers: GHL_HEADERS()});
    if (!res.ok) return;
    const data = await res.json();
    const fresh = data.contact || data;
    const idx = allContacts.findIndex(c => c.id === contactId);
    if (idx >= 0) allContacts[idx] = fresh;
  } catch(e) { /* silent */ }
}

async function createCalendarAppointment(contactId, contactName, appointmentType, dateTime) {
  const calendarIds = {
    online:    CAL_ONLINE,
    discovery: CAL_ONLINE,
    siteVisit: CAL_SITEVISIT,
    callback:  CAL_CALLBACK
  };
  const titles = {
    online:    `اجتماع أونلاين - ${contactName}`,
    discovery: `Discovery Call - ${contactName}`,
    siteVisit: `زيارة عيادة - ${contactName}`,
    callback:  `Callback - ${contactName}`
  };
  const startTime = new Date(dateTime).toISOString();
  const endTime   = new Date(new Date(dateTime).getTime() + 30 * 60000).toISOString();

  const body = {
    calendarId: calendarIds[appointmentType],
    selectedTimezone: 'Asia/Amman',
    startTime,
    endTime,
    title: titles[appointmentType] || `Appointment - ${contactName}`,
    appointmentStatus: 'confirmed',
    address: appointmentType === 'siteVisit' ? 'On-site at clinic' : 'Online Meeting',
    ignoreDateRange: false,
    toNotify: true,
    contactId
  };

  const response = await fetch(`${CFG.ghlBase}/calendars/events/appointments`, {
    method: 'POST',
    headers: GHL_HEADERS(),
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const error = await response.text();
    console.error('Calendar appointment error:', error);
    throw new Error('Failed to create calendar appointment');
  }

  return await response.json();
}

function cleanName(raw) {
  if (!raw) return '';
  let s = raw.trim()
    .replace(/^(dr\.?\s+|د\.\s*)/i, '')
    .replace(/\s+[A-Z][0-9][a-z0-9]*$/i, '')
    .trim();
  if (/^[؀-ۿ\s]+$/.test(s)) return s;
  return s.replace(/\b\w+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}
function getContactName(c) {
  const raw = c.contactName || `${c.firstName||''} ${c.lastName||''}`.trim() || 'Unknown';
  return cleanName(raw);
}
function getContactPhone(c) {
  if (c.phone) return c.phone.trim();
  const cfs = c.customFields || c.customField || [];
  const pf = cfs.find(f => f.key === 'phone' || f.key === 'phone_number');
  return pf ? (pf.value || pf.field_value || '').trim() : '';
}
function fmtWhatsApp(phone) { return phone.replace(/[\s+\-()]/g, ''); }
function getDaysSince(ds) {
  if (!ds) return 9999;
  return Math.floor((Date.now() - new Date(ds)) / 86400000);
}
function getLastTouch(c) {
  return [c.lastActivityDate, c.dateUpdated, c.dateAdded].filter(Boolean).sort().reverse()[0];
}
function getDaysSinceLastTouch(c) { return getDaysSince(getLastTouch(c)); }
function getDaysSinceContact(c) {
  const discDate = getFieldValue(c,'discovery_call_date');
  const svDate   = getFieldValue(c,'site_visit_date');
  const candidates = [c.lastActivityDate, c.dateUpdated, discDate, svDate, c.dateAdded]
    .filter(Boolean).map(d => new Date(d)).filter(d => !isNaN(d.getTime()));
  if (!candidates.length) return 9999;
  return Math.floor((Date.now() - Math.max(...candidates.map(d => d.getTime()))) / 86400000);
}
function getGreeting() {
  return new Date().getHours() < 12 ? 'صباح الخير' : 'مساء الخير';
}
function mapAdnanNote(code) {
  if (!code) return '';
  const m = {needs_time:'محتاج وقت يفكر',needs_to_discuss:'بدو يحكي مع شريك/زوجة',discuss_partner:'بدو يحكي مع شريكه',price:'متردد بالسعر',budget:'متردد بالسعر',competitor:'عنده نظام/منافس',has_system:'عنده نظام/منافس',busy:'كان مشغول',not_sure:'مش متأكد من الفايدة'};
  return m[code.toLowerCase()] || null;
}
function arDaysAgo(days) {
  if (!days || days >= 9999) return null;
  if (days === 0) return 'اليوم';
  if (days < 30) return `${days} يوم`;
  return `${Math.round(days/30)} شهر`;
}
function getCallbackTime(c) {
  if (!c.tags) return null;
  const t = c.tags.find(t => t.startsWith('callback-scheduled-'));
  if (!t) return null;
  const raw = t.replace('callback-scheduled-','');
  // Format: YYYY-MM-DD-HH-MM
  const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})-(\d{2})-(\d{2})$/);
  if (m) return new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00`);
  return null;
}
function getNoAnswerRetryDate(c) {
  if (!c.tags) return null;
  const t = c.tags.find(t => t.startsWith('no-answer-retry-'));
  if (!t) return null;
  return new Date(t.replace('no-answer-retry-','') + 'T00:00:00');
}

/* ── STAGE DETECTION ── */
function getStage(c) {
  const tags = c.tags || [];
  if (tags.includes('lost')) return 'lost';
  if (tags.includes('archived')) return 'archived';
  if (tags.includes('free-trial-sequence')) return 'free-trial';
  if (getFieldValue(c,'closed_won')==='yes' || tags.includes('closed-won')) return 'closed';
  if (getFieldValue(c,'site_visit_done')==='yes' || tags.includes('site-visit-done')) return 'site-done';
  if (getFieldValue(c,'site_visit_booked')==='yes' || tags.includes('site-visit')) return 'site-booked';
  if (getFieldValue(c,'meeting_done')==='yes' || tags.includes('meeting-done')) return 'meeting-done';
  if (getFieldValue(c,'meeting_booked')==='yes' || tags.includes('meeting-booked')) return 'meeting-booked';
  if (getFieldValue(c,'contacted')==='yes' || tags.includes('contacted')) return 'contacted';
  return 'new-lead';
}

/* ── PRIORITY CLASSIFICATION ── */
function classifyContact(c) {
  const stage = getStage(c);
  if (['closed','lost','archived'].includes(stage)) return null;

  const now = new Date();
  const today = now.toDateString();
  const daysSince = getDaysSinceLastTouch(c);
  const naCount = getNoAnswerCount(c);
  const cbTime = getCallbackTime(c);
  const retryDate = getNoAnswerRetryDate(c);
  const discDate = getFieldValue(c,'discovery_call_date');
  const daysSinceDisc = getDaysSince(discDate);

  // Callback today and past due
  if (cbTime && cbTime.toDateString() === today && cbTime <= now)
    return {priority:'urgent', reason:'Callback overdue', cbTime};
  // Callback today but not yet
  if (cbTime && cbTime.toDateString() === today && cbTime > now)
    return {priority:'scheduled', reason:`Callback ${fmt12hr(cbTime)}`, cbTime};
  // Missed callback (past day, not today)
  if (cbTime && cbTime < now && cbTime.toDateString() !== today)
    return {priority:'urgent', reason:'Missed callback', cbTime};
  // No-answer retry due today
  if (retryDate && retryDate.toDateString() === today)
    return {priority:'urgent', reason:`Retry #${naCount+1}/6`, retryDate};
  // Post-discovery >5d no site visit
  if (stage==='meeting-done' && daysSinceDisc > 5 && daysSinceDisc < 9999)
    return {priority:'urgent', reason:`${daysSinceDisc}d post-discovery`, daysSince};
  if (stage==='meeting-done' && daysSinceDisc >= 9999)
    return {priority:'warm', reason:'Discovery done — follow up', daysSince};
  // Free trial / 6+ NAs
  if (stage==='free-trial' || naCount >= 6)
    return {priority:'cold', reason:'Free trial sequence', daysSince};
  // 60+ days cold
  if (daysSince >= 60 && daysSince < 9999)
    return {priority:'cold', reason:`${daysSince}d cold`, daysSince};
  if (daysSince >= 9999)
    return {priority:'cold', reason:'No activity logged', daysSince};
  // New lead <7d not contacted
  if (stage==='new-lead' && daysSince < 7)
    return {priority:'warm', reason:`New lead ${daysSince}d ago`, daysSince};
  // Contacted, no meeting
  if (stage==='contacted' && !getFieldValue(c,'meeting_booked'))
    return {priority:'warm', reason:'Needs discovery booking', daysSince};
  // Post-discovery <5d
  if (stage==='meeting-done' && daysSinceDisc <= 5)
    return {priority:'warm', reason:`${daysSinceDisc}d post-discovery`, daysSince};
  // Anything else actionable
  if (['new-lead','contacted','meeting-booked','meeting-done'].includes(stage))
    return {priority:'warm', reason:`Follow up (${daysSince}d)`, daysSince};
  return {priority:'cold', reason:`Stale (${daysSince}d)`, daysSince};
}

/* ── RENDER DASHBOARD ── */
function renderDashboard(contacts) {
  const buckets = {urgent:[], scheduled:[], warm:[], cold:[]};
  for (const c of contacts) {
    const cls = classifyContact(c);
    if (!cls) continue;
    c._priority = cls.priority;
    c._reason = cls.reason;
    c._cbTime = cls.cbTime || null;
    c._daysSince = cls.daysSince || getDaysSinceLastTouch(c);
    c._noPhone = !getContactPhone(c);
    buckets[cls.priority].push(c);
  }

  const noPhoneLast = (a, b) => (a._noPhone === b._noPhone ? 0 : a._noPhone ? 1 : -1);
  buckets.urgent.sort((a,b) => {
    const np = noPhoneLast(a,b); if (np) return np;
    if (a._cbTime && b._cbTime) return a._cbTime - b._cbTime;
    if (a._cbTime) return -1; if (b._cbTime) return 1;
    return b._daysSince - a._daysSince;
  });
  buckets.scheduled.sort((a,b) => noPhoneLast(a,b) || ((a._cbTime||0) - (b._cbTime||0)));
  buckets.warm.sort((a,b) => noPhoneLast(a,b) || (a._daysSince - b._daysSince));
  buckets.cold.sort((a,b) => noPhoneLast(a,b) || (b._daysSince - a._daysSince));

  const total = Object.values(buckets).reduce((s,b) => s+b.length, 0);
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-pill"><span style="color:var(--red)">●</span><strong>${buckets.urgent.length}</strong> urgent</div>
    <div class="stat-pill"><strong>${total}</strong> total</div>
  `;

  for (const [key, arr] of Object.entries(buckets)) {
    document.getElementById(`${key}-count`).textContent = arr.length;
    const body = document.getElementById(`${key}-body`);
    body.innerHTML = arr.length
      ? arr.map(c => { try { return renderLeadCard(c); } catch(e) { console.warn('[card] skipped', c.id, e); return ''; } }).join('')
      : `<div class="section-empty">No leads in this category</div>`;
  }
}

  function commonScenarios() {

  const script = getScript(c);

        : 'شفنا إنك زرت موقعنا ومهتم بمعرفة أكثر،\nفأنا حابب أسألك — هل بكون في مشكلة لو\nعملنا اجتماع أونلاين هاليومين نشوف كيف\nبنقدر نساعد عيادتك؟'

  } else if (script.type === 's3') {

    ) + sL('السيناريوهات') + `<div class="scenario-cards-wrap">${scenarioCard('blue','إذا قال شو قالك عني','قالنا إنك دكتور {{specialty}} ناجح وعيادتك بتنمو.\nوهاد بالضبط النوع اللي بنقدر نساعده يوصل\nللمستوى الجاي.')}${commonScenarios()}</div>`;

  } else if (script.type === 's4') {
    const gkS = [
      scenarioCard('orange','إذا قالت الدكتور مشغول','بفهم، وما بدي أزعجه.\nهل بكون في مشكلة لو سألتك —\nامتى بيكون عنده دقيقة؟\nحتى لو بعد ساعة، أنا رح انتظر.'),
      scenarioCard('blue','إذا سألت شو المشروع عن','عن تطوير العيادات الخاصة في الأردن —\nوأنا محتاج رأي دكتور {{specialty}} بالذات\nعشان يكون المشروع دقيق.\nالدكتور {{name}} اسمه طلع في بحثي كخبير بالمجال.'),

      `<div style="text-align:center;padding:12px 0;"><button class="switch-to-doctor-btn" onclick="switchOutreachTab('doctor')">انتقلت للدكتور ←</button></div>`
    ].join('');
    const drS = [
      scenarioCard('green','إذا ضحك / انفتح','شكراً دكتور على الدقيقة.\nبنينا برنامج متخصص للعيادات بيحقق 3 نتائج:\n1. يبني أساس قوي على جوجل بجذب مرضى من داخل وخارج الأردن.\n2. يزيد ولاء المرضى الحاليين.\n3. بنظم المواعيد — بقلل الإلغاء وعدم الحضور.\nهل بكون في مشكلة لو عملنا اجتماع أونلاين\n20 دقيقة هاليومين؟'),
      scenarioCard('orange','إذا قال مش مهتم','بفهمك دكتور، وبحترم وقتك.\nهل بكون في مشكلة لو سألتك سؤال واحد بس؟\nعيادتك هلأ — في مجال إنك تزيد عدد المرضى الجدد،\nولا أنت مكتفي؟',[
        {label:'إذا في مجال للنمو:',text:'هاد بالضبط اللي بنساعد فيه.\nهل بكون في مشكلة لو عملنا 20 دقيقة أونلاين؟\nبدون أي التزام — بس تشوف الأرقام.'},
        {label:'إذا ممتلئ المواعيد:',text:'ماشي دكتور، يسعدك.\nهل بكون في مشكلة لو تواصلت معك بعد 3 شهور؟'}
      ]),
      scenarioCard('orange','إذا قال مشغول هلأ','بالتأكيد دكتور.\nهل بكون في مشكلة لو سألتك —\nالصبح ولا بعد الظهر بيكون أريح إلك؟'),
      scenarioCard('blue','إذا قال شو بتعملوا بالضبط','بنينا برنامج متخصص للعيادات بيحقق 3 نتائج:\n1. يبني أساس قوي على جوجل بجذب مرضى من داخل وخارج الأردن.\n2. يزيد ولاء المرضى الحاليين.\n3. بنظم المواعيد — بقلل الإلغاء وعدم الحضور.\nهل بكون في مشكلة لو عملنا اجتماع أونلاين 20 دقيقة؟'),
      scenarioCard('green','الإغلاق','تمام دكتور.\nهل بكون في مشكلة لو حجزنا الاجتماع —\nعندي غداً الساعة 10 أو بعد بكرا الساعة 12.\nأي وقت أريح إلك؟')
    ].join('');
    scriptHtml = `<div class="script-opener-block" style="padding:0;overflow:hidden;"><div class="script-inner-tabs"><button class="script-inner-tab active" id="outreach-tab-gk" onclick="switchOutreachTab('gk')">السكرتيرة</button><button class="script-inner-tab" id="outreach-tab-doctor" onclick="switchOutreachTab('doctor')">الدكتور</button></div><div class="outreach-panel active" id="outreach-panel-gk"><div class="script-label">فاتحة السكرتيرة</div><div class="script-opener-text">${fill('مرحبا، إن شاله ما أزعجتك.\nمعك راشد، أنا طالب جامعي وعندي\nمشروع تخرج لازم أسلمه الخميس.').replace(/\n/g,'<br>')}</div><div class="script-bridge-text">${fill('بس محتاج رأي دكتور متخصص —\nهل بكون في مشكلة لو أخذت دقيقة\nوحدة بس من وقت الدكتور {{name}}؟\nبس عشان آخذ رأيه المهني.').replace(/\n/g,'<br>')}</div>${sL('السيناريوهات')}<div class="scenario-cards-wrap">${gkS}</div></div><div class="outreach-panel" id="outreach-panel-doctor"><div class="script-label">فاتحة الدكتور</div><div class="script-opener-text">${fill('مرحبا دكتور {{name}}، إن شاله ما أزعجتك.\nمعك راشد — حكت معي السكرتيرة إنك\nممكن تعطيني دقيقة.').replace(/\n/g,'<br>')}</div><div class="script-bridge-text">${fill('بكون صريح معك دكتور —\nأنا مش طالب جامعي.\nأنا راشد من ThreeUp، شركة متخصصة\nبتطوير العيادات في الأردن.\nبس ما كانوا رح يوصلوني إليك\nلو ما استخدمت هاد الأسلوب.\nهل بكون في مشكلة لو أخذت دقيقة وحدة بس؟\nوبعدها إذا ما كان الموضوع يهمك،\nما رح أزعجك مرة ثانية.').replace(/\n/g,'<br>')}</div>${sL('السيناريوهات')}<div class="scenario-cards-wrap">${drS}</div></div></div>`;

  } else if (script.type === 's5') {

    const autoExpandId = (noteKey && noteCardMap[noteKey.toLowerCase()]) || 's5-sc-generic';
    function s5Card(id, type, label, text) {

        s5Card('s5-sc-price','orange','إذا ذكر السعر','بفهمك دكتور. الأرقام بالتفصيل بالزيارة —\nهل بكون في مشكلة لو مرينا عليك\nوبعدها بتقرر على راحتك؟\nما في أي التزام قبل ما تشوف كل شي.'),

  } else if (script.type === 's5c') {

    const refRows5c = [
      discDate ? `<div style="display:flex;gap:8px;margin-bottom:4px;"><span style="color:var(--muted);min-width:120px;">تاريخ الاجتماع الأول:</span><span>${esc(fmtDate(new Date(discDate)))}</span></div>` : '',

function getScript(c) {
  const naCount = getNoAnswerCount(c);
  const daysSince = getDaysSinceContact(c);
  const hasPendingBooking = hasTag(c,'meeting-booked') || hasTag(c,'site-visit') ||
    getFieldValue(c,'meeting_booked')==='yes' || getFieldValue(c,'site_visit_booked')==='yes';
  const stale = daysSince > 30 && !hasPendingBooking;

  if (hasTag(c,'meeting-done') || getFieldValue(c,'meeting_done')==='yes')
    return daysSince > 30 ? {id:'s5c',type:'s5c'} : {id:'s5',type:'s5'};
  if (naCount === 5) return {id:'s7',type:'s7'};
  if (naCount >= 4 || hasTag(c,'cold')) return {id:'s6',type:'s6'};
  if (naCount >= 1) return {id:'s8',type:'s8',attempt:naCount,stale};
  if (hasTag(c,'outreach')) return {id:'s4',type:'s4',stale};
  if (hasTag(c,'referral')) return {id:'s3',type:'s3',stale};
  if (hasTag(c,'website')) return {id:'s2',type:'s2',stale};
  return {id:'s1',type:'s1',stale};
}

async function confirmNoAnswer(t, newCount) {
  const c = currentContact; closeModal(); showLoading('Logging...');
  try {
    // STEP 1 — Increment no_answer_count in GHL
    const fieldId = getNoAnswerFieldId(c);
    const fieldPayload = fieldId
      ? { id: fieldId, field_value: String(newCount) }
      : { key: 'no_answer_count', field_value: String(newCount) };
    await ghlUpdateContact(c.id, { customFields: [fieldPayload] });
    const oldRetryTags = (c.tags || []).filter(tag => tag.startsWith('no-answer-retry-'));
    for (const tag of oldRetryTags) { try { await ghlRemoveTag(c.id, tag); } catch(e) {} }
    if (newCount >= 6) {
      await ghlAddTag(c.id, 'free-trial-sequence');
      toast('Lead moved to Free Trial sequence', 'warning');
    } else {
      toast(`No answer #${newCount} logged to GHL`, 'success');
    }
    // STEP 2 — Remove "no-answer" tag
    try { await ghlRemoveTag(c.id, 'no-answer'); } catch(e) {}
    // STEP 3 — Wait 2s then re-add "no-answer" tag
    await new Promise(resolve => setTimeout(resolve, 2000));
    await ghlAddTag(c.id, 'no-answer');
    await ghlRefreshContact(c.id);
    logAction({action:'no_answer', leadId:c.id, leadName:getContactName(c), timeOnLead:t,
      suspicious:isSuspicious(t), reason:isSuspicious(t)?'outcome_clicked_under_30_seconds':null,
      metadata:{attemptNumber:newCount}});
    updateSyncBadge();
    hideLoading(); closeLeadDetail(); await refreshLeads();
  } catch(e) { hideLoading(); toast('Error: '+e.message,'error'); }
}

    </div>
    <div class="modal-field"><label class="modal-label">Notes (optional)</label>
      <input type="text" id="snr-notes" class="modal-input" placeholder="Additional context..."></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmSpokeNotReady(${t})">Log & Continue</button>
    </div>`);
}

async function confirmSpokeNotReady(t) {
  const objR = document.querySelector('input[name="obj"]:checked');
  let obj = objR ? objR.value : '';
  if (obj==='other') obj = document.getElementById('obj-other')?.value.trim() || 'Other';
  const fuR = document.querySelector('input[name="fu"]:checked');
  let fuDate;
  if (fuR?.value === 'custom') fuDate = new Date(document.getElementById('fu-date').value+'T12:00:00');
  else fuDate = nextBizDay(new Date(), parseInt(fuR?.value||'3'));
  const fuStr = fuDate.toISOString().split('T')[0];
  const c = currentContact; closeModal(); showLoading('Updating GHL...');
  try {
    if (obj) await ghlUpdateContact(c.id, {customFields:[{id:CFG.fields.objection, field_value:obj}]});
    await ghlAddTag(c.id, `follow-up-scheduled-${fuStr}`);
    await ghlUpdateContact(c.id, {customFields:[{id:CFG.fields.contacted, field_value:'yes'}]});
    await ghlRefreshContact(c.id);
    logAction({action:'spoke_not_ready', leadId:c.id, leadName:getContactName(c), timeOnLead:t,
      suspicious:isSuspicious(t), reason:isSuspicious(t)?'outcome_clicked_under_30_seconds':null,
      metadata:{objection:obj, followUpDate:fuStr}});
    updateSyncBadge();
    hideLoading(); toast(`Follow-up set for ${fmtDate(fuDate)}`,'success');
    closeLeadDetail(); await refreshLeads();
  } catch(e) { hideLoading(); toast('Error: '+e.message,'error'); }
}

function outcomeNotInterested() {
  const t = timeOnLead();
  showModal(`
    <div class="modal-title">❌ Not Interested</div>
    <div class="modal-sub">Select lost reason</div>
    <div class="modal-field">
      <label class="checkbox-item"><input type="radio" name="lost" value="Price too high"> Price too high</label>
      <label class="checkbox-item"><input type="radio" name="lost" value="Already using competitor"> Already using competitor</label>
      <label class="checkbox-item"><input type="radio" name="lost" value="Not convinced / no trust"> Not convinced / no trust</label>
      <label class="checkbox-item"><input type="radio" name="lost" value="Bad timing"> Bad timing</label>
      <label class="checkbox-item"><input type="radio" name="lost" value="Not a good fit"> Not a good fit</label>
      <label class="checkbox-item"><input type="radio" name="lost" value="Rude / angry"> Rude / angry</label>
      <label class="checkbox-item"><input type="radio" name="lost" value="other"> Other: <input type="text" id="lost-other" class="modal-input" style="width:160px;margin-left:6px;"></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="confirmNotInterested(${t})">Mark Lost</button>
    </div>`);
}

async function confirmNotInterested(t) {
  const lR = document.querySelector('input[name="lost"]:checked');
  let reason = lR ? lR.value : 'Not specified';
  if (reason==='other') reason = document.getElementById('lost-other')?.value.trim()||'Other';
  const c = currentContact; closeModal(); showLoading('Updating GHL...');
  try {
    await ghlUpdateContact(c.id, {customFields:[
      {id:CFG.fields.lost_reason, field_value:reason},
      {id:CFG.fields.closed_won, field_value:'no'}
    ]});
    for (const tag of (c.tags||[]).filter(t=>['meeting-booked','contacted','site-visit','free-trial-sequence'].some(s=>t.includes(s)))) {
      try { await ghlRemoveTag(c.id,tag); } catch(e){}
    }
    await ghlAddTag(c.id,'lost');
    logAction({action:'lost', leadId:c.id, leadName:getContactName(c), timeOnLead:t,
      suspicious:isSuspicious(t), reason:isSuspicious(t)?'outcome_clicked_under_30_seconds':null,
      metadata:{lostReason:reason}});
    hideLoading(); removeFromList(c.id); toast('Lead marked as lost','success'); closeLeadDetail();
  } catch(e) { hideLoading(); toast('Error: '+e.message,'error'); }
}

function outcomeWrongNumber() {
  const t = timeOnLead();
  showModal(`
    <div class="modal-title">⚠️ Wrong Number</div>
    <div class="modal-sub">Lead will be archived and removed from your list.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="confirmWrongNumber(${t})">Archive</button>
    </div>`);
}

async function confirmWrongNumber(t) {
  const c = currentContact; closeModal(); showLoading('Archiving...');
  try {
    for (const tag of (c.tags||[])) { try { await ghlRemoveTag(c.id,tag); } catch(e){} }
    await ghlAddTag(c.id,'archived');
    logAction({action:'wrong_number', leadId:c.id, leadName:getContactName(c), timeOnLead:t,
      suspicious:isSuspicious(t), reason:isSuspicious(t)?'outcome_clicked_under_30_seconds':null, metadata:{}});
    hideLoading(); removeFromList(c.id); toast('Lead archived','success'); closeLeadDetail();
  } catch(e) { hideLoading(); toast('Error: '+e.message,'error'); }
}

/* ══════════════════════════════════════
   ACTIVITY LOG
══════════════════════════════════════ */
function logAction(entry) {
  const logs = JSON.parse(localStorage.getItem('activityLog')||'[]');
  logs.push({timestamp:new Date().toISOString(), setter:getSetterName(), ...entry});
  localStorage.setItem('activityLog', JSON.stringify(logs));
  // Detect rapid outcomes
  const recent = logs.filter(l=>Date.now()-new Date(l.timestamp).getTime()<120000 && l.action!=='lead_opened');
  if (recent.length>=3) console.warn('[ThreeUp RED FLAG] Rapid outcomes detected:', recent.length, 'in 2 min');
}

/* ══════════════════════════════════════
   BUSINESS DAY UTILS
══════════════════════════════════════ */
function isBizDay(d) { const day=d.getDay(); return day>=0&&day<=4; }
function nextBizDay(from, n=1) {
  const d=new Date(from); let added=0;
  while(added<n){d.setDate(d.getDate()+1);if(isBizDay(d))added++;}
  return d;
}
function nextRetryTime() { const d=nextBizDay(new Date(),1); d.setHours(10,0,0,0); return d; }

/* ══════════════════════════════════════
   UI UTILS
══════════════════════════════════════ */
function showModal(html) {
  document.getElementById('modal-container').innerHTML=
    `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal fade-in">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML=''; }
function toast(msg, type='') {
  const c=document.getElementById('toast-container');
  const el=document.createElement('div'); el.className=`toast ${type}`; el.textContent=msg;
  c.appendChild(el); setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3500);
}
function showLoading(txt='') { document.getElementById('loading-overlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
function toggleSection(k) {
  sectionOpen[k]=!sectionOpen[k];
  document.getElementById(`${k}-body`).classList.toggle('collapsed',!sectionOpen[k]);
  document.getElementById(`${k}-chevron`).textContent=sectionOpen[k]?'▼':'▶';
}
function removeFromList(id) { allContacts=allContacts.filter(c=>c.id!==id); renderDashboard(allContacts); }
function startTimer() {
  clearInterval(timerInterval);
  const el=document.getElementById('timer-display');
  timerInterval=setInterval(()=>{
    if(!leadOpenedAt||!el) return;
    const s=Math.floor((Date.now()-leadOpenedAt)/1000);
    el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    el.className=`timer-display${s>300?' slow':''}`;
  },1000);
}
function fmtDate(d) { if(!d||isNaN(d.getTime()))return'—'; const m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'); return`${m}/${dy}/${d.getFullYear()}`; }
function fmtGHL(d) { return fmtDate(d); }
function fmt12hr(d) { if(!d||isNaN(d.getTime()))return''; let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${m} ${ap}`; }
function todayStr() { const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function timeOptions() {
  let o=''; for(let h=10;h<=19;h++){for(const m of['00','30']){if(h===19&&m==='30')break;const hh=String(h).padStart(2,'0');const hp=h>12?h-12:h,ap=h>=12?'PM':'AM';o+=`<option value="${hh}:${m}">${hp}:${m} ${ap}</option>`;}} return o;
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ══════════════════════════════════════
   TAB SWITCHING & PERFORMANCE
══════════════════════════════════════ */
function switchTab(tab) {
  const calls = document.getElementById('tab-calls');
  const perf  = document.getElementById('tab-performance');
  const btnC  = document.getElementById('tab-btn-calls');
  const btnP  = document.getElementById('tab-btn-performance');
  if (tab === 'calls') {
    calls.classList.remove('hidden');
    perf.classList.add('hidden');
    btnC.classList.add('active');
    btnP.classList.remove('active');
  } else {
    calls.classList.add('hidden');
    perf.classList.remove('hidden');
    btnC.classList.remove('active');
    btnP.classList.add('active');
    renderPerformanceTab();
  }
}

function renderPerformanceTab() {
  const logs = JSON.parse(localStorage.getItem('activityLog') || '[]');
  const now  = new Date();

  const todayStr2 = now.toDateString();
  const todayLogs = logs.filter(l => new Date(l.timestamp).toDateString() === todayStr2);

  const dow = now.getDay();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - dow);
  weekStart.setHours(0,0,0,0);
  const weekLogs = logs.filter(l => new Date(l.timestamp) >= weekStart);

  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthLogs  = logs.filter(l => new Date(l.timestamp) >= monthStart);

  function countAct(arr, action) { return arr.filter(l => l.action === action).length; }
  function totalCalls(arr)  { return arr.filter(l => l.action !== 'lead_opened').length; }
  function totalBook(arr)   { return countAct(arr,'discovery_booked') + countAct(arr,'site_visit_booked'); }
  function successRate(arr) {
    const t = totalCalls(arr); if (!t) return '—';
    return ((totalBook(arr)/t)*100).toFixed(1)+'%';
  }
  function avgTime(arr) {
    const w = arr.filter(l => l.timeOnLead > 0);
    if (!w.length) return '—';
    const avg = w.reduce((s,l)=>s+l.timeOnLead,0)/w.length;
    return `${Math.floor(avg/60)}m ${Math.floor(avg%60)}s`;
  }

  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const byDay = {};
  weekLogs.forEach(l => {
    if (l.action==='discovery_booked'||l.action==='site_visit_booked') {
      const d = new Date(l.timestamp).getDay();
      byDay[d] = (byDay[d]||0)+1;
    }
  });
  const bestEntry = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const bestDay   = bestEntry ? `${dayNames[bestEntry[0]]} (${bestEntry[1]})` : '—';

  const suspicious      = logs.filter(l => l.suspicious);
  const lostNoReason    = logs.filter(l => l.action==='lost' && (!l.metadata?.lostReason || l.metadata.lostReason==='Not specified'));
  const overdueCallbacks = allContacts.filter(c => { const cb=getCallbackTime(c); return cb && cb < now; });
  const highNA           = allContacts.filter(c => getNoAnswerCount(c) >= 5 && !hasTag(c,'meeting-booked') && !hasTag(c,'site-visit'));

  const setterMap = {};
  monthLogs.forEach(l => {
    const s = l.setter||'Unknown';
    if (!setterMap[s]) setterMap[s] = {calls:0,bookings:0};
    if (l.action !== 'lead_opened') setterMap[s].calls++;
    if (l.action==='discovery_booked'||l.action==='site_visit_booked') setterMap[s].bookings++;
  });
  const leaderboard = Object.entries(setterMap)
    .map(([name,s])=>({name, calls:s.calls, bookings:s.bookings,
      rate: s.calls ? ((s.bookings/s.calls)*100).toFixed(1)+'%' : '0%'}))
    .sort((a,b)=>b.bookings-a.bookings);

  function stat(label, value, color) {
    return `<div class="perf-stat"><div class="perf-num" style="color:${color||'var(--text)'}">${value}</div><div class="perf-label">${label}</div></div>`;
  }
  function flag(cls, count, label, detail) {
    return `<div class="flag-row flag-${cls}"><span class="flag-count">${count}</span><span class="flag-label">${label}</span>${detail?`<span class="flag-detail">${esc(detail)}</span>`:''}</div>`;
  }

  const todayBook = totalBook(todayLogs);
  const weekBook  = totalBook(weekLogs);

  document.getElementById('tab-performance').innerHTML = `
    <div class="perf-wrap">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:4px;">
        <div style="font-size:18px;font-weight:800;font-family:'Syne',sans-serif;">Performance</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="renderPerformanceTab()">↻ Refresh</button>
          <button class="btn btn-amber btn-sm" onclick="exportLocalLogs()">⬇ Export CSV</button>
        </div>
      </div>

      <div class="perf-section">
        <div class="perf-section-title">📅 Today's Stats</div>
        <div class="perf-grid">
          ${stat('Calls Logged', totalCalls(todayLogs))}
          ${stat('Discovery Booked', countAct(todayLogs,'discovery_booked'), 'var(--green-dark)')}
          ${stat('Site Visit Booked', countAct(todayLogs,'site_visit_booked'), 'var(--green-dark)')}
          ${stat('No Answer', countAct(todayLogs,'no_answer'), 'var(--amber-dark)')}
          ${stat('Not Interested', countAct(todayLogs,'lost'), 'var(--red)')}
          ${stat('Not Ready', countAct(todayLogs,'spoke_not_ready'))}
          ${stat('Success Rate', successRate(todayLogs), todayBook>0?'var(--green-dark)':'var(--muted)')}
          ${stat('Avg Time/Lead', avgTime(todayLogs))}
        </div>
      </div>

      <div class="perf-section">
        <div class="perf-section-title">📆 This Week (Sun–Sat)</div>
        <div class="perf-grid">
          ${stat('Total Calls', totalCalls(weekLogs))}
          ${stat('Bookings', weekBook, weekBook>0?'var(--green-dark)':'')}
          ${stat('Discovery Booked', countAct(weekLogs,'discovery_booked'), 'var(--green-dark)')}
          ${stat('Site Visit Booked', countAct(weekLogs,'site_visit_booked'), 'var(--green-dark)')}
          ${stat('No Answer', countAct(weekLogs,'no_answer'), 'var(--amber-dark)')}
          ${stat('Success Rate', successRate(weekLogs), 'var(--purple)')}
          ${stat('Best Day', bestDay)}
          ${stat('Avg Time/Lead', avgTime(weekLogs))}
        </div>
      </div>

      <div class="perf-section">
        <div class="perf-section-title">🚨 Red Flags — For Adnan</div>
        ${flag(suspicious.length?'red':'green', suspicious.length, 'Outcomes logged under 30 seconds',
          suspicious.length ? suspicious.slice(0,3).map(l=>`${l.leadName||'?'} (${l.action})`).join(', ')+(suspicious.length>3?` +${suspicious.length-3} more`:'') : '')}
        ${flag(lostNoReason.length?'red':'green', lostNoReason.length, 'Leads marked lost with no reason')}
        ${flag(overdueCallbacks.length?'amber':'green', overdueCallbacks.length, 'Overdue callbacks not actioned',
          overdueCallbacks.length ? overdueCallbacks.slice(0,3).map(c=>getContactName(c)).join(', ')+(overdueCallbacks.length>3?` +${overdueCallbacks.length-3} more`:'') : '')}
        ${flag(highNA.length?'amber':'green', highNA.length, 'Leads with 5+ no-answers and no booking',
          highNA.length ? highNA.slice(0,3).map(c=>getContactName(c)).join(', ')+(highNA.length>3?` +${highNA.length-3} more`:'') : '')}
      </div>

      <div class="perf-section">
        <div class="perf-section-title">🏆 Leaderboard — This Month</div>
        ${leaderboard.length === 0
          ? `<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center;">No activity logged this month yet.</div>`
          : leaderboard.map((s,i) => `
            <div class="lb-row ${i===0?'top':''}">
              <div class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
              <div class="lb-name">${esc(s.name)}</div>
              <div class="lb-stats">
                <div class="lb-stat"><div class="lb-stat-num" style="color:var(--green-dark)">${s.bookings}</div><div class="lb-stat-label">bookings</div></div>
                <div class="lb-stat"><div class="lb-stat-num">${s.calls}</div><div class="lb-stat-label">calls</div></div>
                <div class="lb-stat"><div class="lb-stat-num" style="color:var(--purple)">${s.rate}</div><div class="lb-stat-label">rate</div></div>
              </div>
            </div>`).join('')
        }
      </div>
    </div>
  `;
}

/* ── BOOT ── */
(function(){
  const auth=JSON.parse(localStorage.getItem('auth')||'null');
  if(auth&&auth.authenticated) showApp();
})();
